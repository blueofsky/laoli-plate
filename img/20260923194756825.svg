<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <rect x="0" y="0" width="680" height="380" fill="#ffffff"/>
  <text x="340" y="42" font-size="22" font-weight="700" fill="#1f2937" text-anchor="middle">Skill 在架构里的位置</text>
  <text x="340" y="68" font-size="13" fill="#6b7280" text-anchor="middle">tool 是原子能力 · MCP 是跨边界接口 · Skill 是组合层</text>

  <!-- tool -->
  <rect x="40" y="120" width="160" height="150" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="120" y="158" font-size="17" font-weight="700" fill="#92400e" text-anchor="middle">tool</text>
  <text x="120" y="188" font-size="13" fill="#1f2937" text-anchor="middle">原子能力</text>
  <text x="120" y="212" font-size="12" fill="#6b7280" text-anchor="middle">一个函数</text>
  <text x="120" y="232" font-size="12" fill="#6b7280" text-anchor="middle">干一件事</text>
  <text x="120" y="258" font-size="12" fill="#6b7280" text-anchor="middle">本地函数 / SDK</text>

  <!-- mcp -->
  <rect x="260" y="120" width="160" height="150" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="340" y="158" font-size="17" font-weight="700" fill="#5b21b6" text-anchor="middle">MCP</text>
  <text x="340" y="188" font-size="13" fill="#1f2937" text-anchor="middle">跨边界接口</text>
  <text x="340" y="212" font-size="12" fill="#6b7280" text-anchor="middle">标准协议暴露</text>
  <text x="340" y="232" font-size="12" fill="#6b7280" text-anchor="middle">JSON-RPC 2.0</text>
  <text x="340" y="258" font-size="12" fill="#6b7280" text-anchor="middle">stdio / HTTP</text>

  <!-- skill -->
  <rect x="480" y="120" width="160" height="150" rx="14" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="560" y="158" font-size="17" font-weight="700" fill="#0f766e" text-anchor="middle">Skill</text>
  <text x="560" y="188" font-size="13" fill="#1f2937" text-anchor="middle">组合层</text>
  <text x="560" y="212" font-size="12" fill="#6b7280" text-anchor="middle">一组 tool</text>
  <text x="560" y="232" font-size="12" fill="#6b7280" text-anchor="middle">+ 流程 + 上下文</text>
  <text x="560" y="258" font-size="12" fill="#6b7280" text-anchor="middle">名字即能力</text>

  <!-- arrows -->
  <path d="M205 195 L255 195" stroke="#9ca3af" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M425 195 L475 195" stroke="#9ca3af" stroke-width="2" marker-end="url(#ah)"/>
  <text x="230" y="185" font-size="11" fill="#9ca3af" text-anchor="middle">原子</text>
  <text x="450" y="185" font-size="11" fill="#9ca3af" text-anchor="middle">接口</text>

  <text x="340" y="330" font-size="13" fill="#374151" text-anchor="middle">三者是「原子 / 接口 / 组合」的递进，不是互相替代</text>

  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#9ca3af"/>
    </marker>
  </defs>
</svg>
