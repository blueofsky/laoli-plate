<svg viewBox="0 0 680 406" width="100%" xmlns="http://www.w3.org/2000/svg" role="img">
<text x="50" y="28" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#1f2329">层与层之间的五条张力</text>

<!-- 左列：四层栈 + 横切安全执行 -->
<rect x="50" y="60" width="250" height="46" rx="6" fill="#0f766e"/>
<text x="66" y="80" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="500" fill="#FFFFFF">内核层（1–4）</text>
<text x="66" y="97" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#ccfbf1">Loop / 状态 / 消息事件 / 中间件</text>

<rect x="50" y="120" width="250" height="46" rx="6" fill="#0d9488"/>
<text x="66" y="140" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="500" fill="#FFFFFF">能力层（5–9）</text>
<text x="66" y="157" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#ccfbf1">工具簇 5–7 · 记忆与上下文 8–9</text>

<rect x="50" y="180" width="250" height="46" rx="6" fill="#14b8a6"/>
<text x="66" y="200" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="500" fill="#06243f">决策层（11）· 规划与推理</text>

<rect x="50" y="240" width="250" height="46" rx="6" fill="#5eead4"/>
<text x="66" y="260" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="500" fill="#06243f">执行层（12）· 执行环境</text>

<rect x="50" y="310" width="250" height="40" rx="6" fill="#d97706"/>
<text x="66" y="334" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="500" fill="#FFFFFF">安全执行（10）· 横切关注点</text>

<!-- 引线：层条右缘 → 张力块左缘 -->
<path d="M300 83 L380 68" stroke="#94a3b8" stroke-width="1.2" fill="none"/>
<circle cx="300" cy="83" r="3" fill="#64748b"/>
<path d="M300 143 L380 120" stroke="#94a3b8" stroke-width="1.2" fill="none"/>
<circle cx="300" cy="143" r="3" fill="#64748b"/>
<path d="M300 203 L380 172" stroke="#94a3b8" stroke-width="1.2" fill="none"/>
<circle cx="300" cy="203" r="3" fill="#64748b"/>
<path d="M300 263 L380 224" stroke="#94a3b8" stroke-width="1.2" fill="none"/>
<circle cx="300" cy="263" r="3" fill="#64748b"/>
<path d="M300 90 L380 268" stroke="#94a3b8" stroke-width="1.2" fill="none"/>
<circle cx="300" cy="90" r="3" fill="#64748b"/>
<path d="M300 330 L380 284" stroke="#94a3b8" stroke-width="1.2" fill="none"/>
<circle cx="300" cy="330" r="3" fill="#64748b"/>

<!-- 右列：五张张力卡 -->
<rect x="380" y="46" width="280" height="44" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="394" y="65" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="500" fill="#0f172a">状态存外部 × 每轮读回</text>
<text x="394" y="81" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#64748b">内核层：状态管理 × 能力层：上下文装配</text>

<rect x="380" y="98" width="280" height="44" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="394" y="117" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="500" fill="#0f172a">工具多 × 窗口满</text>
<text x="394" y="133" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#64748b">能力层：工具簇 × 记忆与上下文簇</text>

<rect x="380" y="150" width="280" height="44" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="394" y="169" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="500" fill="#0f172a">计划细 × 轮次多</text>
<text x="394" y="185" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#64748b">决策层：规划与推理 × 内核层：循环推进</text>

<rect x="380" y="202" width="280" height="44" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="394" y="221" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="500" fill="#0f172a">隔离强 × 取出难</text>
<text x="394" y="237" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#64748b">执行层：执行环境 × 横切：安全执行</text>

<rect x="380" y="254" width="280" height="44" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="394" y="273" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="500" fill="#0f172a">装配点 × 逃逸点</text>
<text x="394" y="289" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#64748b">内核层：中间件 × 横切：安全执行</text>

<text x="50" y="374" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#64748b">连线表示张力关系：一方能力的获得以另一方的代价换取；静态关系图，非执行流。</text>
<text x="50" y="388" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#64748b">层名与编号同正文及系列逻辑线图。</text>
</svg>
