<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <style>
    .t { font-size: 15px; font-weight: 700; }
    .s { font-size: 12px; fill: #475569; }
    .b { font-size: 13px; }
    .teal { fill: #0d9488; }
    .purple { fill: #6d28d9; }
    .code { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 12.5px; }
  </style>
  <rect x="0" y="0" width="720" height="320" fill="#f8fafc"/>

  <text x="360" y="30" text-anchor="middle" class="t teal">写一个 server 的最小骨架</text>

  <!-- step1 -->
  <rect x="40" y="60" width="300" height="70" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/>
  <text x="58" y="84" class="code teal">@mcp.tool()</text>
  <text x="58" y="106" class="s">普通函数 → MCP 工具</text>
  <text x="58" y="124" class="s">docstring + 类型提示 自动抽 schema</text>

  <!-- arrow -->
  <line x1="340" y1="95" x2="378" y2="95" stroke="#0d9488" stroke-width="2" marker-end="url(#r)"/>

  <!-- step2 -->
  <rect x="384" y="60" width="296" height="70" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="402" y="92" class="code teal">inputSchema（自动抽取）</text>
  <text x="402" y="114" class="s">无需手写 JSON Schema</text>
  <text x="402" y="124" class="s">消费方 tools/list 拿到定义</text>

  <!-- two launch paths -->
  <line x1="190" y1="130" x2="190" y2="170" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#g)"/>
  <line x1="530" y1="130" x2="530" y2="170" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#g)"/>

  <!-- stdio -->
  <rect x="40" y="176" width="300" height="86" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/>
  <text x="58" y="200" class="code teal">mcp.run(transport="stdio")</text>
  <text x="58" y="224" class="s">框架以子进程方式拉起</text>
  <text x="58" y="244" class="s">本地开发最省事，零网络开销</text>

  <!-- streamable http -->
  <rect x="384" y="176" width="296" height="86" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="402" y="200" class="code purple">mcp.run(transport="streamable-http")</text>
  <text x="402" y="224" class="s">HTTP POST + 可选 SSE 流式</text>
  <text x="402" y="244" class="s">鉴权走 header（Bearer / 自定义）</text>

  <text x="360" y="300" text-anchor="middle" class="s">两种启动方式切换，工具语义不变</text>

  <defs>
    <marker id="r" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#0d9488"/></marker>
    <marker id="g" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/></marker>
  </defs>
</svg>
