  <text x="423" y="372" font-size="10" fill="#374151" text-anchor="middle">零向量库依赖</text>

  <!-- 三家 bolt-on -->
  <rect x="509" y="90" width="155" height="290" rx="12" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <rect x="509" y="90" width="155" height="40" rx="12" fill="#d1fae5"/>
  <text x="586" y="116" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">bolt-on 中间件</text>
  <text x="586" y="150" font-size="11" fill="#6b7280" text-anchor="middle">Mem0 / Letta / Zep</text>
  <text x="586" y="176" font-size="11" fill="#374151" text-anchor="middle">Mem0 最轻向量</text>
  <text x="586" y="196" font-size="11" fill="#374151" text-anchor="middle">Letta 运行时</text>
  <text x="586" y="216" font-size="11" fill="#374151" text-anchor="middle">自编辑内存块</text>
  <text x="586" y="242" font-size="11" fill="#374151" text-anchor="middle">Zep 时序图谱</text>
  <text x="586" y="268" font-size="11" fill="#374151" text-anchor="middle">valid_at /</text>
  <text x="586" y="288" font-size="11" fill="#374151" text-anchor="middle">invalid_at</text>
  <text x="586" y="314" font-size="11" fill="#374151" text-anchor="middle">对应 §2 映射表</text>
  <text x="586" y="334" font-size="11" fill="#374151" text-anchor="middle">bolt-on 任何 agent</text>
  <text x="586" y="360" font-size="11" fill="#374151" text-anchor="middle">三家形态各异</text>
</svg>
