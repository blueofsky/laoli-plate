<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <rect x="0" y="0" width="680" height="400" fill="#ffffff"/>
  <text x="340" y="38" font-size="22" font-weight="700" fill="#1f2937" text-anchor="middle">记忆落地四类范式对照</text>
  <text x="340" y="64" font-size="12" fill="#6b7280" text-anchor="middle">托管 store · 内存故事 · 文件即记忆运行时 · bolt-on 中间件</text>

  <!-- LangGraph -->
  <rect x="20" y="90" width="155" height="290" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
  <rect x="20" y="90" width="155" height="40" rx="12" fill="#ccfbf1"/>
  <text x="97" y="116" font-size="13" font-weight="700" fill="#0f766e" text-anchor="middle">托管 store</text>
  <text x="97" y="150" font-size="11" fill="#6b7280" text-anchor="middle">LangGraph Store</text>
  <text x="97" y="176" font-size="11" fill="#374151" text-anchor="middle">稳定 · cross-thread</text>
  <text x="97" y="196" font-size="11" fill="#374151" text-anchor="middle">checkpointer+store</text>
  <text x="97" y="216" font-size="11" fill="#374151" text-anchor="middle">必须双挂</text>
  <text x="97" y="242" font-size="11" fill="#374151" text-anchor="middle">namespace tuple</text>
  <text x="97" y="268" font-size="11" fill="#374151" text-anchor="middle">语义检索需</text>
  <text x="97" y="288" font-size="11" fill="#374151" text-anchor="middle">embedding 索引</text>
  <text x="97" y="314" font-size="11" fill="#374151" text-anchor="middle">LangMem 封装</text>
  <text x="97" y="334" font-size="11" fill="#374151" text-anchor="middle">三类记忆</text>
  <text x="97" y="360" font-size="11" fill="#374151" text-anchor="middle">托管向量 store</text>

  <!-- OpenAI -->
  <rect x="183" y="90" width="155" height="290" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="183" y="90" width="155" height="40" rx="12" fill="#ede9fe"/>
  <text x="260" y="116" font-size="13" font-weight="700" fill="#5b21b6" text-anchor="middle">内存故事</text>
  <text x="260" y="150" font-size="11" fill="#6b7280" text-anchor="middle">OpenAI Agents SDK v2</text>
  <text x="260" y="176" font-size="11" fill="#374151" text-anchor="middle">Configurable</text>
  <text x="260" y="196" font-size="11" fill="#374151" text-anchor="middle">Memory（2026-04）</text>
  <text x="260" y="222" font-size="11" fill="#374151" text-anchor="middle">Session（短时）</text>
  <text x="260" y="248" font-size="11" fill="#374151" text-anchor="middle">Sandbox（长时·文件）</text>
  <text x="260" y="274" font-size="11" fill="#374151" text-anchor="middle">harness 接口</text>
  <text x="260" y="300" font-size="11" fill="#374151" text-anchor="middle">非开箱托管</text>
  <text x="260" y="320" font-size="11" fill="#374151" text-anchor="middle">向量库</text>
  <text x="260" y="346" font-size="11" fill="#374151" text-anchor="middle">异步写</text>

  <!-- 文件即记忆运行时 -->
  <rect x="346" y="90" width="155" height="290" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <rect x="346" y="90" width="155" height="40" rx="12" fill="#fef3c7"/>
  <text x="423" y="112" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">文件即记忆运行时</text>
  <text x="423" y="132" font-size="10" fill="#92400e" text-anchor="middle">MEMORY.md 范式</text>
  <text x="423" y="160" font-size="11" font-weight="700" fill="#374151" text-anchor="middle">AgentScope 2.0</text>
  <text x="423" y="178" font-size="10" fill="#6b7280" text-anchor="middle">旧 memory 已 @Deprecated</text>
  <text x="423" y="198" font-size="10" fill="#374151" text-anchor="middle">MEMORY.md+@Tool 写</text>
  <text x="423" y="224" font-size="11" font-weight="700" fill="#374151" text-anchor="middle">OpenClaw</text>
  <text x="423" y="242" font-size="10" fill="#6b7280" text-anchor="middle">SQLite/Redis+心跳自检</text>
  <text x="423" y="262" font-size="10" fill="#374151" text-anchor="middle">每日笔记→MEMORY.md</text>
  <text x="423" y="288" font-size="11" font-weight="700" fill="#374151" text-anchor="middle">Hermes</text>
  <text x="423" y="306" font-size="10" fill="#6b7280" text-anchor="middle">FTS5+语义混合检索</text>
  <text x="423" y="326" font-size="10" fill="#374151" text-anchor="middle">三层：facts/skills/session</text>
