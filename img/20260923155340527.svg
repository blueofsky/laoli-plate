<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <style>
    .t { font-size: 15px; font-weight: 700; }
    .s { font-size: 12px; fill: #475569; }
    .b { font-size: 13px; }
    .teal { fill: #0d9488; }
    .amber { fill: #b45309; }
    .purple { fill: #6d28d9; }
    .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 8; }
    .fw { fill: #ccfbf1; stroke: #0d9488; stroke-width: 1.5; }
    .tool { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; }
    .srv { fill: #ede9fe; stroke: #6d28d9; stroke-width: 1.5; }
  </style>
  <rect x="0" y="0" width="720" height="380" fill="#f8fafc"/>

  <!-- 左：无 MCP -->
  <text x="185" y="34" text-anchor="middle" class="t amber">无 MCP：每框架各写一套工具</text>
  <g>
    <rect x="40" y="70" width="120" height="48" rx="8" class="fw"/>
    <text x="100" y="99" text-anchor="middle" class="b teal">OpenAI</text>
    <rect x="205" y="70" width="120" height="48" rx="8" class="tool"/>
    <text x="265" y="95" text-anchor="middle" class="b amber">重复造的工具</text>
    <line x1="160" y1="94" x2="203" y2="94" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar)"/>

    <rect x="40" y="170" width="120" height="48" rx="8" class="fw"/>
    <text x="100" y="199" text-anchor="middle" class="b teal">LangGraph</text>
    <rect x="205" y="170" width="120" height="48" rx="8" class="tool"/>
    <text x="265" y="195" text-anchor="middle" class="b amber">重复造的工具</text>
    <line x1="160" y1="194" x2="203" y2="194" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar)"/>

    <rect x="40" y="270" width="120" height="48" rx="8" class="fw"/>
    <text x="100" y="299" text-anchor="middle" class="b teal">AgentScope</text>
    <rect x="205" y="270" width="120" height="48" rx="8" class="tool"/>
    <text x="265" y="295" text-anchor="middle" class="b amber">重复造的工具</text>
    <line x1="160" y1="294" x2="203" y2="294" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar)"/>
  </g>

  <!-- 右：有 MCP -->
  <text x="535" y="34" text-anchor="middle" class="t teal">有 MCP：一个 server 被多框架消费</text>
  <rect x="500" y="155" width="160" height="64" rx="8" class="srv"/>
  <text x="580" y="182" text-anchor="middle" class="b purple">company-calendar</text>
  <text x="580" y="202" text-anchor="middle" class="s">server（JSON-RPC）</text>

  <g>
    <rect x="380" y="70" width="110" height="44" rx="8" class="fw"/>
    <text x="435" y="97" text-anchor="middle" class="b teal">OpenAI</text>
    <line x1="490" y1="92" x2="498" y2="158" stroke="#0d9488" stroke-width="1.5" marker-end="url(#arT)"/>

    <rect x="380" y="168" width="110" height="44" rx="8" class="fw"/>
    <text x="435" y="195" text-anchor="middle" class="b teal">LangGraph</text>
    <line x1="490" y1="190" x2="498" y2="190" stroke="#0d9488" stroke-width="1.5" marker-end="url(#arT)"/>

    <rect x="380" y="266" width="110" height="44" rx="8" class="fw"/>
    <text x="435" y="293" text-anchor="middle" class="b teal">AgentScope</text>
    <line x1="490" y1="288" x2="498" y2="212" stroke="#0d9488" stroke-width="1.5" marker-end="url(#arT)"/>
  </g>

  <text x="360" y="370" text-anchor="middle" class="s">左侧 N×M 重复实现；右侧 build once, use everywhere</text>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="arT" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#0d9488"/></marker>
  </defs>
</svg>
