<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="680" height="500" fill="#ffffff"/>
  <defs>
    <marker id="mTeal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#0d9488"/>
    </marker>
    <marker id="mAmber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Panel A: synchronous -->
  <text x="20" y="36" font-size="15" font-weight="bold" fill="#0f766e">同步阻塞：父发起一批子任务，等全部返回再继续</text>
  <rect x="40" y="96" width="96" height="48" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="88" y="125" text-anchor="middle" font-size="13" fill="#0f766e">父 agent</text>

  <rect x="452" y="58" width="120" height="36" rx="6" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="512" y="81" text-anchor="middle" font-size="12.5" fill="#134e4a">子 agent A</text>
  <rect x="452" y="110" width="120" height="36" rx="6" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="512" y="133" text-anchor="middle" font-size="12.5" fill="#134e4a">子 agent B</text>
  <rect x="452" y="162" width="120" height="36" rx="6" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="512" y="185" text-anchor="middle" font-size="12.5" fill="#134e4a">子 agent C</text>

  <path d="M136,112 C280,76 350,76 452,76" fill="none" stroke="#0d9488" stroke-width="2" marker-end="url(#mTeal)"/>
  <path d="M136,120 C290,128 360,128 452,128" fill="none" stroke="#0d9488" stroke-width="2" marker-end="url(#mTeal)"/>
  <path d="M136,128 C280,180 350,180 452,180" fill="none" stroke="#0d9488" stroke-width="2" marker-end="url(#mTeal)"/>

  <path d="M452,190 C300,236 220,200 136,140" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#mAmber)"/>
  <text x="300" y="238" text-anchor="middle" font-size="12" fill="#b45309">等全部返回才继续（按最慢的一个算）</text>

  <!-- Panel B: asynchronous -->
  <text x="20" y="292" font-size="15" font-weight="bold" fill="#0f766e">异步事件：谁完成谁上报，慢任务不拖住快任务</text>
  <rect x="110" y="330" width="110" height="38" rx="6" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="165" y="354" text-anchor="middle" font-size="12.5" fill="#134e4a">子 agent A</text>
  <rect x="285" y="330" width="110" height="38" rx="6" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="340" y="354" text-anchor="middle" font-size="12.5" fill="#134e4a">子 agent B</text>
  <rect x="460" y="330" width="110" height="38" rx="6" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="515" y="354" text-anchor="middle" font-size="12.5" fill="#134e4a">子 agent C</text>

  <line x1="80" y1="420" x2="600" y2="420" stroke="#0f766e" stroke-width="2"/>
  <text x="600" y="412" text-anchor="end" font-size="12" fill="#0f766e">事件总线</text>

  <line x1="165" y1="368" x2="165" y2="420" stroke="#0d9488" stroke-width="2" marker-end="url(#mTeal)"/>
  <line x1="340" y1="368" x2="340" y2="420" stroke="#0d9488" stroke-width="2" marker-end="url(#mTeal)"/>
  <line x1="515" y1="368" x2="515" y2="420" stroke="#0d9488" stroke-width="2" marker-end="url(#mTeal)"/>

  <rect x="270" y="452" width="140" height="38" rx="6" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="340" y="476" text-anchor="middle" font-size="13" fill="#0f766e">orchestrator</text>
  <line x1="340" y1="420" x2="340" y2="452" stroke="#0f766e" stroke-width="2" marker-end="url(#mTeal)"/>

  <text x="30" y="470" font-size="12" fill="#b45309">完成即上报，不阻塞</text>
</svg>
