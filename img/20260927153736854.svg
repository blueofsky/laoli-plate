<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="680" height="300" fill="#ffffff"/>
  <text x="340" y="30" text-anchor="middle" font-size="18" fill="#0f766e" font-weight="bold">同一块沙箱，两个视角</text>
  <defs>
    <marker id="c" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#475569"/></marker>
  </defs>

  <rect x="34" y="74" width="206" height="150" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="137" y="100" text-anchor="middle" font-size="13" fill="#92400e" font-weight="bold">第 10 期 · 防线视角</text>
  <text x="137" y="130" text-anchor="middle" font-size="11" fill="#92400e">隔离强度够不够</text>
  <text x="137" y="154" text-anchor="middle" font-size="11" fill="#92400e">逃逸了怎么办</text>
  <text x="137" y="178" text-anchor="middle" font-size="11" fill="#92400e">权限与审计</text>
  <text x="137" y="202" text-anchor="middle" font-size="11" fill="#92400e">隔离失效影响多大</text>

  <rect x="275" y="110" width="130" height="86" rx="10" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <text x="340" y="158" text-anchor="middle" font-size="15" fill="#334155" font-weight="bold">沙箱</text>

  <rect x="440" y="74" width="206" height="150" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="543" y="100" text-anchor="middle" font-size="13" fill="#0f766e" font-weight="bold">第 12 期 · 运行时视角</text>
  <text x="543" y="130" text-anchor="middle" font-size="11" fill="#0f766e">启动多快</text>
  <text x="543" y="154" text-anchor="middle" font-size="11" fill="#0f766e">状态怎么保</text>
  <text x="543" y="178" text-anchor="middle" font-size="11" fill="#0f766e">怎么调度</text>
  <text x="543" y="202" text-anchor="middle" font-size="11" fill="#0f766e">出错怎么恢复</text>

  <line x1="240" y1="149" x2="271" y2="149" stroke="#475569" stroke-width="2" marker-end="url(#c)"/>
  <line x1="407" y1="149" x2="436" y2="149" stroke="#475569" stroke-width="2" marker-end="url(#c)"/>

  <text x="340" y="264" text-anchor="middle" font-size="12" fill="#64748b">两篇的考察范围不同</text>
</svg>
