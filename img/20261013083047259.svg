<text x="50" y="420" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#64748b">颜色表示决定权归属：越偏青绿，交出去的决定权越多；越偏琥珀，自己留得越多。</text>
<text x="50" y="436" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#64748b">格内文字为该形态的典型做法；各框架版本与 API 变动频繁，以官网当期文档为准。</text>
