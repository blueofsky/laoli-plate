<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="680" height="470" fill="#ffffff"/>

  <!-- A: Fan-out / Fan-in -->
  <text x="20" y="26" font-size="14" font-weight="bold" fill="#0f766e">Fan-out / Fan-in：并行独立子任务，各自返回，父汇总</text>
  <rect x="40" y="80" width="90" height="40" rx="6" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="85" y="105" text-anchor="middle" font-size="13" fill="#0f766e">父 agent</text>
  <rect x="320" y="45" width="90" height="34" rx="6" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="365" y="67" text-anchor="middle" font-size="12" fill="#134e4a">子 1</text>
  <rect x="320" y="90" width="90" height="34" rx="6" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="365" y="112" text-anchor="middle" font-size="12" fill="#134e4a">子 2</text>
  <rect x="320" y="135" width="90" height="34" rx="6" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="365" y="157" text-anchor="middle" font-size="12" fill="#134e4a">子 3</text>
  <line x1="130" y1="95" x2="318" y2="62" stroke="#0d9488" stroke-width="2" marker-end="url(#a)"/>
  <line x1="130" y1="100" x2="318" y2="107" stroke="#0d9488" stroke-width="2" marker-end="url(#a)"/>
  <line x1="130" y1="105" x2="318" y2="152" stroke="#0d9488" stroke-width="2" marker-end="url(#a)"/>
  <path d="M365,180 C365,210 200,210 85,140" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#b)"/>
  <text x="220" y="205" text-anchor="middle" font-size="12" fill="#b45309">fan-in 汇总</text>

  <!-- B: Pipeline -->
  <text x="20" y="250" font-size="14" font-weight="bold" fill="#0f766e">Pipeline：串行，上一步输出是下一步输入</text>
  <rect x="30" y="285" width="70" height="36" rx="6" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="65" y="308" text-anchor="middle" font-size="12" fill="#0f766e">父</text>
  <rect x="170" y="285" width="80" height="36" rx="6" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="210" y="308" text-anchor="middle" font-size="12" fill="#134e4a">分析</text>
  <rect x="320" y="285" width="80" height="36" rx="6" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="360" y="308" text-anchor="middle" font-size="12" fill="#134e4a">改造</text>
  <rect x="470" y="285" width="80" height="36" rx="6" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="510" y="308" text-anchor="middle" font-size="12" fill="#134e4a">测试</text>
  <line x1="100" y1="303" x2="168" y2="303" stroke="#0d9488" stroke-width="2" marker-end="url(#a)"/>
  <line x1="250" y1="303" x2="318" y2="303" stroke="#0d9488" stroke-width="2" marker-end="url(#a)"/>
  <line x1="400" y1="303" x2="468" y2="303" stroke="#0d9488" stroke-width="2" marker-end="url(#a)"/>

  <!-- C: Iterative -->
  <text x="20" y="350" font-size="14" font-weight="bold" fill="#0f766e">Iterative refinement：父派子做 → 父审 → 打回 → 直到达标</text>
  <rect x="40" y="375" width="90" height="40" rx="6" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="85" y="400" text-anchor="middle" font-size="13" fill="#0f766e">父 agent</text>
  <rect x="320" y="375" width="90" height="40" rx="6" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="365" y="400" text-anchor="middle" font-size="12" fill="#134e4a">子 agent</text>
  <line x1="130" y1="395" x2="318" y2="395" stroke="#0d9488" stroke-width="2" marker-end="url(#a)"/>
  <text x="200" y="389" text-anchor="middle" font-size="12" fill="#0f766e">派发</text>
  <path d="M320,415 C320,455 130,455 130,415" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#b)"/>
  <text x="200" y="438" text-anchor="middle" font-size="12" fill="#b45309">未达标 · 带反馈回退</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#0d9488"/></marker>
    <marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/></marker>
  </defs>
</svg>
