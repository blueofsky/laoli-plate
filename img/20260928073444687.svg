<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="680" height="380" fill="#ffffff"/>
  <text x="340" y="28" text-anchor="middle" font-size="17" fill="#0f766e" font-weight="bold">沙箱的三种入口，落回同一条路径</text>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#0d9488"/></marker>
  </defs>

  <rect x="30" y="50" width="190" height="52" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.3"/>
  <text x="125" y="72" text-anchor="middle" font-size="11" fill="#0f766e" font-weight="bold">新建</text>
  <text x="125" y="90" text-anchor="middle" font-size="9.5" fill="#0d9488">空环境</text>

  <rect x="245" y="50" width="190" height="52" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.3"/>
  <text x="340" y="72" text-anchor="middle" font-size="11" fill="#0f766e" font-weight="bold">从暂停恢复</text>
  <text x="340" y="90" text-anchor="middle" font-size="9.5" fill="#0d9488">同一个沙箱 ID</text>

  <rect x="460" y="50" width="190" height="52" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.3"/>
  <text x="555" y="72" text-anchor="middle" font-size="11" fill="#0f766e" font-weight="bold">从快照分叉</text>
  <text x="555" y="90" text-anchor="middle" font-size="9.5" fill="#0d9488">count = N</text>

  <line x1="125" y1="102" x2="240" y2="138" stroke="#0d9488" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="340" y1="102" x2="340" y2="138" stroke="#0d9488" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="555" y1="102" x2="440" y2="138" stroke="#0d9488" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="110" y="140" width="460" height="104" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.5"/>
  <text x="340" y="166" text-anchor="middle" font-size="12" fill="#0f766e" font-weight="bold">恢复一份预启动快照，而不是启动一个内核</text>
  <text x="130" y="190" font-size="10" fill="#0f766e">内存页按缺页惰性加载——访问到才载入</text>
  <text x="130" y="210" font-size="10" fill="#0f766e">根文件系统是只读镜像上的写时复制覆盖层</text>
  <text x="130" y="230" font-size="10" fill="#0f766e">三条入口因此共用同一条快路径</text>

  <rect x="110" y="268" width="220" height="76" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="126" y="292" font-size="11" fill="#334155" font-weight="bold">冷启动</text>
  <text x="126" y="312" font-size="9.5" fill="#475569">空环境从零拉起</text>
  <text x="126" y="330" font-size="9.5" fill="#475569">可用预热池摊薄</text>

  <rect x="350" y="268" width="220" height="76" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="366" y="292" font-size="11" fill="#92400e" font-weight="bold">恢复</text>
  <text x="366" y="312" font-size="9.5" fill="#a16207">已有状态重新挂上</text>
  <text x="366" y="330" font-size="9.5" fill="#a16207">取决于状态体积，内存越大越贵</text>
</svg>
