<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="680" height="360" fill="#ffffff"/>
  <text x="340" y="28" text-anchor="middle" font-size="18" fill="#0f766e" font-weight="bold">计划的表示与持有 + replanning 回路（含思考等级 escalate）</text>
  <defs>
    <marker id="g" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#0d9488"/></marker>
    <marker id="h" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7c3aed"/></marker>
  </defs>
  <!-- 持有位置 -->
  <rect x="30" y="55" width="180" height="56" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="120" y="80" text-anchor="middle" font-size="13" fill="#0f766e" font-weight="bold">scratchpad</text>
  <text x="120" y="100" text-anchor="middle" font-size="10" fill="#0f766e">模型草稿区</text>
  <rect x="250" y="55" width="180" height="56" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="340" y="80" text-anchor="middle" font-size="13" fill="#0f766e" font-weight="bold">会话态</text>
  <text x="340" y="100" text-anchor="middle" font-size="10" fill="#0f766e">框架管理</text>
  <rect x="470" y="55" width="180" height="56" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="560" y="80" text-anchor="middle" font-size="13" fill="#0f766e" font-weight="bold">上下文窗口</text>
  <text x="560" y="100" text-anchor="middle" font-size="10" fill="#0f766e">拼进每轮 prompt</text>
  <!-- 主路径 -->
  <rect x="260" y="150" width="160" height="40" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="340" y="175" text-anchor="middle" font-size="13" fill="#0f766e" font-weight="bold">计划</text>
  <rect x="260" y="210" width="160" height="40" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/>
  <text x="340" y="235" text-anchor="middle" font-size="13" fill="#0f766e">执行</text>
  <text x="340" y="265" text-anchor="middle" font-size="10" fill="#0d9488">正常步骤：effort = low / adaptive</text>
  <line x1="340" y1="190" x2="340" y2="210" stroke="#0d9488" stroke-width="1.5" marker-end="url(#g)"/>
  <rect x="260" y="280" width="160" height="40" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/>
  <text x="340" y="305" text-anchor="middle" font-size="13" fill="#0f766e">重规划</text>
  <line x1="340" y1="250" x2="340" y2="280" stroke="#0d9488" stroke-width="1.5" marker-end="url(#g)"/>
  <line x1="260" y1="300" x2="200" y2="300" stroke="#0d9488" stroke-width="1.5" marker-end="url(#g)"/>
  <line x1="200" y1="300" x2="200" y2="195" stroke="#0d9488" stroke-width="1.5" marker-end="url(#g)"/>
  <line x1="200" y1="195" x2="260" y2="170" stroke="#0d9488" stroke-width="1.5" marker-end="url(#g)"/>
  <!-- escalate 控制流 -->
  <rect x="450" y="205" width="180" height="48" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="540" y="228" text-anchor="middle" font-size="12" fill="#5b21b6" font-weight="bold">深度思考 · Escalate</text>
  <text x="540" y="245" text-anchor="middle" font-size="10" fill="#5b21b6">low → high / max</text>
  <!-- 从执行指向深度思考，标注失败/偏离 -->
  <path d="M420,230 C440,230 432,229 450,229" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#h)"/>
  <text x="435" y="222" text-anchor="middle" font-size="9" fill="#7c3aed">失败 / 偏离</text>
  <!-- 深度思考回灌重规划 -->
  <line x1="540" y1="253" x2="540" y2="300" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#h)"/>
  <text x="600" y="282" text-anchor="start" font-size="9" fill="#7c3aed">根因 + 重规划</text>
  <!-- 回到主路径后降档 -->
  <text x="340" y="345" text-anchor="middle" font-size="10" fill="#0d9488">回到主路径后 effort 降回 low</text>
</svg>
