<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="680" height="380" fill="#ffffff"/>
  <text x="340" y="30" text-anchor="middle" font-size="18" fill="#0f766e" font-weight="bold">执行环境的抽象层：agent 不变，变的是「在哪执行」</text>
  <defs>
    <marker id="c" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#475569"/></marker>
  </defs>

  <rect x="30" y="153" width="112" height="64" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <text x="86" y="179" text-anchor="middle" font-size="12" fill="#334155" font-weight="bold">agent 逻辑</text>
  <text x="86" y="200" text-anchor="middle" font-size="10" fill="#334155">不改一行</text>

  <rect x="190" y="58" width="460" height="124" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="420" y="82" text-anchor="middle" font-size="12" fill="#92400e" font-weight="bold">第一层 · 存储抽象 · Backend</text>
  <text x="420" y="100" text-anchor="middle" font-size="10" fill="#92400e">文件与产物放在哪：临时、持久、真实磁盘</text>
  <rect x="206" y="116" width="100" height="28" rx="5" fill="#ffffff" stroke="#d97706"/>
  <text x="256" y="134" text-anchor="middle" font-size="9.5" fill="#92400e">State</text>
  <rect x="319" y="116" width="100" height="28" rx="5" fill="#ffffff" stroke="#d97706"/>
  <text x="369" y="134" text-anchor="middle" font-size="9.5" fill="#92400e">Filesystem</text>
  <rect x="432" y="116" width="100" height="28" rx="5" fill="#ffffff" stroke="#d97706"/>
  <text x="482" y="134" text-anchor="middle" font-size="9.5" fill="#92400e">Store</text>
  <rect x="545" y="116" width="100" height="28" rx="5" fill="#ffffff" stroke="#d97706"/>
  <text x="595" y="134" text-anchor="middle" font-size="9.5" fill="#92400e">Composite</text>
  <text x="420" y="168" text-anchor="middle" font-size="10" fill="#92400e">路径即策略：/tmp 临时、/memories 持久</text>

  <rect x="190" y="208" width="460" height="104" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="420" y="232" text-anchor="middle" font-size="12" fill="#0f766e" font-weight="bold">第二层 · 运行时抽象 · Workspace</text>
  <text x="420" y="250" text-anchor="middle" font-size="10" fill="#0f766e">代码在哪跑：沙箱后端可换，同一份接口</text>
  <rect x="206" y="266" width="76" height="24" rx="5" fill="#ffffff" stroke="#0d9488"/>
  <text x="244" y="282" text-anchor="middle" font-size="10" fill="#0f766e">Local</text>
  <rect x="294" y="266" width="76" height="24" rx="5" fill="#ffffff" stroke="#0d9488"/>
  <text x="332" y="282" text-anchor="middle" font-size="10" fill="#0f766e">Docker</text>
  <rect x="382" y="266" width="76" height="24" rx="5" fill="#ffffff" stroke="#0d9488"/>
  <text x="420" y="282" text-anchor="middle" font-size="10" fill="#0f766e">E2B</text>
  <rect x="470" y="266" width="76" height="24" rx="5" fill="#ffffff" stroke="#0d9488"/>
  <text x="508" y="282" text-anchor="middle" font-size="10" fill="#0f766e">K8s</text>
  <rect x="558" y="266" width="76" height="24" rx="5" fill="#ffffff" stroke="#0d9488"/>
  <text x="596" y="282" text-anchor="middle" font-size="10" fill="#0f766e">…</text>
  <text x="420" y="304" text-anchor="middle" font-size="10" fill="#0f766e">容器、云沙箱、K8s Pod 在这一层</text>

  <line x1="142" y1="172" x2="188" y2="120" stroke="#475569" stroke-width="2" marker-end="url(#c)"/>
  <line x1="142" y1="198" x2="188" y2="260" stroke="#475569" stroke-width="2" marker-end="url(#c)"/>

  <text x="340" y="348" text-anchor="middle" font-size="12" fill="#64748b">两层都在解耦「在哪执行」，agent 要做什么始终不变</text>
</svg>
