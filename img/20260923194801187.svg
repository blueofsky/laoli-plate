<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <rect x="0" y="0" width="680" height="400" fill="#ffffff"/>
  <text x="340" y="42" font-size="22" font-weight="700" fill="#1f2937" text-anchor="middle">渐进披露：三级加载控制 token</text>
  <text x="340" y="68" font-size="13" fill="#6b7280" text-anchor="middle">Progressive Disclosure（agentskills.io 标准）</text>

  <!-- L1 -->
  <rect x="60" y="100" width="560" height="72" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="84" y="130" font-size="16" font-weight="700" fill="#0f766e" text-anchor="start">L1 元数据</text>
  <text x="84" y="154" font-size="12" fill="#374151" text-anchor="start">name + description　·　约 100 token　·　启动时注入系统提示，常驻</text>
  <text x="600" y="130" font-size="11" fill="#0f766e" text-anchor="end">常驻</text>

  <!-- L2 -->
  <rect x="100" y="196" width="480" height="72" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="124" y="226" font-size="16" font-weight="700" fill="#92400e" text-anchor="start">L2 指令（SKILL.md 正文）</text>
  <text x="124" y="250" font-size="12" fill="#374151" text-anchor="start">请求匹配 description 后读取　·　建议 &lt; 5000 token</text>
  <text x="560" y="226" font-size="11" fill="#92400e" text-anchor="end">触发后加载</text>

  <!-- L3 -->
  <rect x="140" y="292" width="400" height="72" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="164" y="322" font-size="16" font-weight="700" fill="#5b21b6" text-anchor="start">L3 资源（scripts / references / assets）</text>
  <text x="164" y="346" font-size="12" fill="#374151" text-anchor="start">被指令引用时才读取或执行　·　文档可数 MB，进上下文的只有一节</text>
  <text x="520" y="322" font-size="11" fill="#5b21b6" text-anchor="end">按需</text>

  <!-- arrows down -->
  <path d="M340 172 L340 196" stroke="#9ca3af" stroke-width="2" marker-end="url(#ad)"/>
  <path d="M340 268 L340 292" stroke="#9ca3af" stroke-width="2" marker-end="url(#ad)"/>

  <defs>
    <marker id="ad" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#9ca3af"/>
    </marker>
  </defs>
</svg>
