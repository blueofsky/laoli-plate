<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <rect x="0" y="0" width="680" height="430" fill="#ffffff"/>
  <text x="340" y="40" font-size="22" font-weight="700" fill="#1f2937" text-anchor="middle">Memory Base 与 Context Window 拼装层</text>
  <text x="340" y="66" font-size="13" fill="#6b7280" text-anchor="middle">三类记忆被检索后注入 Prompt 的不同 Zone</text>

  <!-- Memory Base -->
  <rect x="40" y="110" width="210" height="250" rx="14" fill="#ecfeff" stroke="#0d9488" stroke-width="2"/>
  <text x="145" y="138" font-size="16" font-weight="700" fill="#0f766e" text-anchor="middle">Memory Base</text>

  <rect x="60" y="158" width="170" height="52" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="145" y="180" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">情境记忆</text>
  <text x="145" y="200" font-size="11" fill="#6b7280" text-anchor="middle">时间线 / Log</text>

  <rect x="60" y="222" width="170" height="52" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="145" y="244" font-size="13" font-weight="700" fill="#0f766e" text-anchor="middle">语义记忆</text>
  <text x="145" y="264" font-size="11" fill="#6b7280" text-anchor="middle">向量库 + 知识图谱</text>

  <rect x="60" y="286" width="170" height="52" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="145" y="308" font-size="13" font-weight="700" fill="#5b21b6" text-anchor="middle">程序记忆</text>
  <text x="145" y="328" font-size="11" fill="#6b7280" text-anchor="middle">System Prompt / Skill</text>

  <!-- arrow -->
  <text x="312" y="212" font-size="12" fill="#6b7280" text-anchor="middle">Fetch 检索</text>
  <text x="312" y="230" font-size="12" fill="#6b7280" text-anchor="middle">+ 注入</text>
  <path d="M255 235 L368 235" stroke="#9ca3af" stroke-width="2" marker-end="url(#ah)"/>

  <!-- Context Window -->
  <rect x="380" y="110" width="270" height="250" rx="14" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="515" y="138" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">Context Window</text>

  <rect x="400" y="158" width="230" height="55" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="515" y="180" font-size="13" font-weight="700" fill="#0f766e" text-anchor="middle">系统提示区</text>
  <text x="515" y="200" font-size="11" fill="#6b7280" text-anchor="middle">语义记忆注入（偏好 / 约定）</text>

  <rect x="400" y="223" width="230" height="55" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="515" y="245" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">历史区</text>
  <text x="515" y="265" font-size="11" fill="#6b7280" text-anchor="middle">情境记忆（发生了什么）</text>

  <rect x="400" y="288" width="230" height="55" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="515" y="310" font-size="13" font-weight="700" fill="#5b21b6" text-anchor="middle">工具区</text>
  <text x="515" y="330" font-size="11" fill="#6b7280" text-anchor="middle">memory_write / search …</text>

  <text x="340" y="402" font-size="12" fill="#374151" text-anchor="middle">记忆是 Context Window 的一个输入来源，与系统提示、工具结果、当前轮一同拼成每轮请求</text>

  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#9ca3af"/>
    </marker>
  </defs>
</svg>
