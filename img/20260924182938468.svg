<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <rect x="0" y="0" width="680" height="470" fill="#ffffff"/>
  <text x="340" y="36" font-size="22" font-weight="700" fill="#1f2937" text-anchor="middle">Memory Base 与 Context Window 拼装层</text>
  <text x="340" y="62" font-size="13" fill="#6b7280" text-anchor="middle">三类记忆进入上下文窗口的方式不同：前两类检索注入，程序记忆常驻或经 Skill 调用</text>

  <!-- Memory Base -->
  <rect x="40" y="100" width="215" height="320" rx="14" fill="#ecfeff" stroke="#0d9488" stroke-width="2"/>
  <text x="147" y="128" font-size="16" font-weight="700" fill="#0f766e" text-anchor="middle">Memory Base（长时记忆）</text>

  <rect x="60" y="146" width="175" height="56" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="147" y="170" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">情境记忆</text>
  <text x="147" y="190" font-size="11" fill="#6b7280" text-anchor="middle">时间线 / Log</text>

  <rect x="60" y="218" width="175" height="56" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="147" y="242" font-size="13" font-weight="700" fill="#0f766e" text-anchor="middle">语义记忆</text>
  <text x="147" y="262" font-size="11" fill="#6b7280" text-anchor="middle">向量库 + 知识图谱</text>

  <rect x="60" y="290" width="175" height="56" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="147" y="314" font-size="13" font-weight="700" fill="#5b21b6" text-anchor="middle">程序记忆</text>
  <text x="147" y="334" font-size="11" fill="#6b7280" text-anchor="middle">System Prompt / Skill</text>

  <!-- Context Window -->
  <rect x="395" y="100" width="250" height="320" rx="14" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="520" y="128" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">Context Window</text>

  <rect x="415" y="146" width="210" height="70" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="520" y="172" font-size="13" font-weight="700" fill="#0f766e" text-anchor="middle">系统提示区</text>
  <text x="520" y="194" font-size="11" fill="#6b7280" text-anchor="middle">偏好 / 约定（语义记忆）</text>
  <text x="520" y="208" font-size="11" fill="#6b7280" text-anchor="middle">常驻 SOP（程序记忆）</text>

  <rect x="415" y="232" width="210" height="70" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="520" y="258" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">历史区</text>
  <text x="520" y="280" font-size="11" fill="#6b7280" text-anchor="middle">发生了什么（情境记忆）</text>

  <rect x="415" y="318" width="210" height="70" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="520" y="344" font-size="13" font-weight="700" fill="#5b21b6" text-anchor="middle">工具区（动作）</text>
  <text x="520" y="366" font-size="11" fill="#6b7280" text-anchor="middle">Skill 调用（程序记忆）</text>
  <text x="520" y="380" font-size="11" fill="#6b7280" text-anchor="middle">memory_write / search</text>

  <!-- arrows: retrieval (solid) -->
  <path d="M236 244 L408 178" stroke="#0d9488" stroke-width="2.5" fill="none" marker-end="url(#ah_teal)"/>
  <text x="300" y="200" font-size="11" fill="#0f766e" text-anchor="middle">检索注入</text>

  <path d="M236 172 L408 262" stroke="#d97706" stroke-width="2.5" fill="none" marker-end="url(#ah_amber)"/>
  <text x="305" y="232" font-size="11" fill="#92400e" text-anchor="middle">检索注入</text>

  <!-- arrows: non-retrieval (dashed) -->
  <path d="M236 318 Q320 250 408 168" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="7 5" fill="none" marker-end="url(#ah_purple)"/>
  <text x="300" y="290" font-size="11" fill="#5b21b6" text-anchor="middle">常驻 SOP</text>

  <path d="M236 332 L408 352" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="7 5" fill="none" marker-end="url(#ah_purple)"/>
  <text x="300" y="350" font-size="11" fill="#5b21b6" text-anchor="middle">Skill 调用</text>

  <!-- legend -->
  <line x1="150" y1="448" x2="180" y2="448" stroke="#475569" stroke-width="2.5"/>
  <text x="190" y="452" font-size="11" fill="#374151" text-anchor="start">实线 = 检索注入（按 Score 排序）</text>
  <line x1="380" y1="448" x2="410" y2="448" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="420" y="452" font-size="11" fill="#374151" text-anchor="start">虚线 = 非检索（常驻 / 调用）</text>

  <defs>
    <marker id="ah_teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0d9488"/>
    </marker>
    <marker id="ah_amber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="ah_purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>
</svg>
