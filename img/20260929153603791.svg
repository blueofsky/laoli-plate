<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="680" height="300" fill="#ffffff"/>
  <defs>
    <marker id="mTeal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#0d9488"/>
    </marker>
    <marker id="mAmber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#d97706"/>
    </marker>
  </defs>

  <text x="20" y="34" font-size="15" font-weight="bold" fill="#0f766e">MCP 与 A2A：一个管垂直，一个管水平</text>

  <rect x="110" y="80" width="150" height="40" rx="6" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="185" y="105" text-anchor="middle" font-size="12.5" fill="#0f766e">orchestrator agent</text>
  <rect x="420" y="80" width="150" height="40" rx="6" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="495" y="105" text-anchor="middle" font-size="12.5" fill="#0f766e">remote agent</text>

  <line x1="260" y1="93" x2="420" y2="93" stroke="#d97706" stroke-width="2" marker-end="url(#mAmber)"/>
  <line x1="420" y1="107" x2="260" y2="107" stroke="#d97706" stroke-width="2" marker-end="url(#mAmber)"/>
  <text x="340" y="68" text-anchor="middle" font-size="12" fill="#b45309">A2A（水平）：agent ↔ agent</text>

  <rect x="130" y="206" width="110" height="36" rx="6" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="185" y="229" text-anchor="middle" font-size="12.5" fill="#134e4a">工具 / 数据</text>
  <rect x="440" y="206" width="110" height="36" rx="6" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="495" y="229" text-anchor="middle" font-size="12.5" fill="#134e4a">工具 / 数据</text>

  <line x1="185" y1="120" x2="185" y2="206" stroke="#0d9488" stroke-width="2" marker-end="url(#mTeal)"/>
  <line x1="495" y1="120" x2="495" y2="206" stroke="#0d9488" stroke-width="2" marker-end="url(#mTeal)"/>
  <text x="196" y="168" font-size="12" fill="#0f766e">MCP</text>
  <text x="506" y="168" font-size="12" fill="#0f766e">MCP</text>

  <text x="340" y="282" text-anchor="middle" font-size="12" fill="#6b7280">MCP 管垂直：agent 到工具与数据；A2A 管水平：agent 到 agent</text>
</svg>
