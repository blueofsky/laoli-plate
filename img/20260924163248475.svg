<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <rect x="0" y="0" width="680" height="400" fill="#ffffff"/>
  <text x="340" y="40" font-size="22" font-weight="700" fill="#1f2937" text-anchor="middle">记忆即工具</text>
  <text x="340" y="66" font-size="13" fill="#6b7280" text-anchor="middle">agent 经四个 tool 读写独立 store，而非框架偷偷往 prompt 里塞</text>

  <rect x="250" y="100" width="180" height="64" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="340" y="128" font-size="16" font-weight="700" fill="#0f766e" text-anchor="middle">Agent</text>
  <text x="340" y="148" font-size="11" fill="#6b7280" text-anchor="middle">自主决定记 / 查</text>

  <rect x="40" y="90" width="150" height="52" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="115" y="113" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">memory_write</text>
  <text x="115" y="132" font-size="10" fill="#6b7280" text-anchor="middle">写入</text>

  <rect x="40" y="160" width="150" height="52" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="115" y="183" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">memory_read</text>
  <text x="115" y="202" font-size="10" fill="#6b7280" text-anchor="middle">精确取</text>

  <rect x="490" y="90" width="150" height="52" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="565" y="113" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">memory_search</text>
  <text x="565" y="132" font-size="10" fill="#6b7280" text-anchor="middle">语义检索</text>

  <rect x="490" y="160" width="150" height="52" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="565" y="183" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">memory_delete</text>
  <text x="565" y="202" font-size="10" fill="#6b7280" text-anchor="middle">失效 / 删除</text>

  <path d="M190 116 L248 120" stroke="#9ca3af" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M190 186 L248 150" stroke="#9ca3af" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M490 116 L432 120" stroke="#9ca3af" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M490 186 L432 150" stroke="#9ca3af" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="170" y="300" width="340" height="64" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="340" y="326" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">Store（记忆子系统）</text>
  <text x="340" y="346" font-size="11" fill="#6b7280" text-anchor="middle">向量库 · KV · 知识图谱</text>

  <path d="M115 142 L300 300" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M115 212 L300 312" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M565 142 L380 300" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M565 212 L380 312" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)"/>

  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#9ca3af"/>
    </marker>
  </defs>
</svg>
