<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <rect width="680" height="380" fill="#ffffff"/>
  <text x="340" y="34" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">沙箱隔离强度谱系（隔离与成本同增）</text>

  <g>
    <rect x="20" y="84" width="116" height="150" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="78" y="116" font-size="13" font-weight="700" fill="#991b1b" text-anchor="middle">无隔离</text>
    <text x="78" y="158" font-size="12" fill="#7f1d1d" text-anchor="middle">隔离：零</text>
    <text x="78" y="198" font-size="11" fill="#7f1d1d" text-anchor="middle">代价：快</text>
    <text x="78" y="216" font-size="11" fill="#7f1d1d" text-anchor="middle">但 rm -rf</text>
    <text x="78" y="232" font-size="11" fill="#7f1d1d" text-anchor="middle">清空宿主</text>
  </g>
  <g>
    <rect x="152" y="84" width="116" height="150" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="210" y="116" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">受限子进程</text>
    <text x="210" y="158" font-size="12" fill="#92400e" text-anchor="middle">隔离：弱</text>
    <text x="210" y="198" font-size="11" fill="#92400e" text-anchor="middle">代价：低延迟</text>
    <text x="210" y="216" font-size="11" fill="#92400e" text-anchor="middle">挡不住</text>
    <text x="210" y="232" font-size="11" fill="#92400e" text-anchor="middle">上爬</text>
  </g>
  <g>
    <rect x="284" y="84" width="116" height="150" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
    <text x="342" y="116" font-size="13" font-weight="700" fill="#0f766e" text-anchor="middle">容器</text>
    <text x="342" y="158" font-size="12" fill="#0f766e" text-anchor="middle">隔离：中</text>
    <text x="342" y="198" font-size="11" fill="#0f766e" text-anchor="middle">代价：启动几秒</text>
    <text x="342" y="216" font-size="11" fill="#0f766e" text-anchor="middle">镜像维护</text>
  </g>
  <g>
    <rect x="416" y="84" width="116" height="150" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
    <text x="474" y="112" font-size="13" font-weight="700" fill="#0f766e" text-anchor="middle">VM 级</text>
    <text x="474" y="130" font-size="11" fill="#0f766e" text-anchor="middle">gVisor / Kata</text>
    <text x="474" y="170" font-size="12" fill="#0f766e" text-anchor="middle">隔离：强</text>
    <text x="474" y="210" font-size="11" fill="#0f766e" text-anchor="middle">代价：更重</text>
    <text x="474" y="228" font-size="11" fill="#0f766e" text-anchor="middle">资源高</text>
  </g>
  <g>
    <rect x="548" y="84" width="116" height="150" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="606" y="116" font-size="13" font-weight="700" fill="#5b21b6" text-anchor="middle">WASM</text>
    <text x="606" y="158" font-size="12" fill="#5b21b6" text-anchor="middle">隔离：强且轻</text>
    <text x="606" y="198" font-size="11" fill="#5b21b6" text-anchor="middle">代价：工具须</text>
    <text x="606" y="216" font-size="11" fill="#5b21b6" text-anchor="middle">编译进 WASM</text>
  </g>

  <path d="M40 244 L640 244" stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <text x="340" y="270" font-size="13" fill="#374151" text-anchor="middle">从左 → 右：隔离强度 ↑　成本 / 延迟 ↑</text>

  <text x="340" y="320" font-size="12" fill="#374151" text-anchor="middle">封得住才叫沙箱：挂全 fs / 网络全开 / 主密钥写死 = 形同虚设</text>

  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#9ca3af"/>
    </marker>
  </defs>
</svg>
