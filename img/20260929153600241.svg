<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="680" height="320" fill="#ffffff"/>
  <defs>
    <marker id="mTeal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#0d9488"/>
    </marker>
    <marker id="mAmber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#d97706"/>
    </marker>
    <marker id="mPurple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <line x1="228" y1="56" x2="228" y2="300" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="443" y1="56" x2="443" y2="300" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Column 1: message passing -->
  <text x="30" y="36" font-size="14" font-weight="bold" fill="#0f766e">消息传递</text>
  <rect x="60" y="80" width="110" height="36" rx="6" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="115" y="103" text-anchor="middle" font-size="12.5" fill="#134e4a">agent</text>
  <rect x="60" y="190" width="110" height="36" rx="6" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="115" y="213" text-anchor="middle" font-size="12.5" fill="#134e4a">agent</text>
  <line x1="105" y1="190" x2="105" y2="116" stroke="#0d9488" stroke-width="2" marker-end="url(#mTeal)"/>
  <line x1="125" y1="116" x2="125" y2="190" stroke="#0d9488" stroke-width="2" marker-end="url(#mTeal)"/>
  <text x="115" y="256" text-anchor="middle" font-size="12" fill="#b45309">点对点或广播</text>

  <!-- Column 2: blackboard -->
  <text x="252" y="36" font-size="14" font-weight="bold" fill="#0f766e">共享黑板</text>
  <rect x="276" y="70" width="120" height="36" rx="6" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="336" y="93" text-anchor="middle" font-size="12.5" fill="#134e4a">agent</text>
  <rect x="286" y="150" width="100" height="40" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="336" y="175" text-anchor="middle" font-size="12.5" fill="#92400e">黑板</text>
  <rect x="276" y="234" width="120" height="36" rx="6" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="336" y="257" text-anchor="middle" font-size="12.5" fill="#134e4a">agent</text>
  <line x1="336" y1="106" x2="336" y2="150" stroke="#d97706" stroke-width="2" marker-end="url(#mAmber)"/>
  <line x1="336" y1="234" x2="336" y2="190" stroke="#d97706" stroke-width="2" marker-end="url(#mAmber)"/>
  <text x="336" y="296" text-anchor="middle" font-size="12" fill="#b45309">谁都能读写同一块空间</text>

  <!-- Column 3: shared state -->
  <text x="467" y="36" font-size="14" font-weight="bold" fill="#0f766e">共享状态</text>
  <rect x="493" y="70" width="120" height="36" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="553" y="93" text-anchor="middle" font-size="12.5" fill="#5b21b6">节点</text>
  <rect x="483" y="150" width="140" height="40" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="553" y="175" text-anchor="middle" font-size="12.5" fill="#5b21b6">共享 state</text>
  <rect x="493" y="234" width="120" height="36" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="553" y="257" text-anchor="middle" font-size="12.5" fill="#5b21b6">节点</text>
  <line x1="553" y1="106" x2="553" y2="150" stroke="#7c3aed" stroke-width="2" marker-end="url(#mPurple)"/>
  <line x1="553" y1="234" x2="553" y2="190" stroke="#7c3aed" stroke-width="2" marker-end="url(#mPurple)"/>
  <text x="553" y="296" text-anchor="middle" font-size="12" fill="#b45309">所有节点读写同一对象</text>
</svg>
