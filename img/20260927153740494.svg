<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="680" height="300" fill="#ffffff"/>
  <text x="340" y="30" text-anchor="middle" font-size="18" fill="#0f766e" font-weight="bold">把环境状态当作可恢复资源</text>
  <defs>
    <marker id="c" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#475569"/></marker>
  </defs>

  <rect x="30" y="118" width="124" height="54" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="92" y="141" text-anchor="middle" font-size="11.5" fill="#0f766e" font-weight="bold">干净环境</text>
  <text x="92" y="161" text-anchor="middle" font-size="10" fill="#0f766e">已建立快照点</text>
  <line x1="154" y1="145" x2="186" y2="145" stroke="#475569" stroke-width="2" marker-end="url(#c)"/>

  <rect x="190" y="118" width="140" height="54" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="260" y="141" text-anchor="middle" font-size="11.5" fill="#92400e" font-weight="bold">多步操作</text>
  <text x="260" y="161" text-anchor="middle" font-size="10" fill="#92400e">环境逐渐漂移</text>
  <line x1="330" y1="145" x2="362" y2="145" stroke="#475569" stroke-width="2" marker-end="url(#c)"/>

  <rect x="366" y="118" width="116" height="54" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="424" y="141" text-anchor="middle" font-size="11.5" fill="#92400e" font-weight="bold">问题暴露</text>
  <text x="424" y="161" text-anchor="middle" font-size="10" fill="#92400e">几十步之后</text>

  <line x1="482" y1="134" x2="510" y2="80" stroke="#475569" stroke-width="2" marker-end="url(#c)"/>
  <line x1="482" y1="145" x2="510" y2="138" stroke="#475569" stroke-width="2" marker-end="url(#c)"/>
  <line x1="482" y1="156" x2="510" y2="196" stroke="#475569" stroke-width="2" marker-end="url(#c)"/>

  <rect x="514" y="58" width="136" height="40" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="582" y="83" text-anchor="middle" font-size="11" fill="#0f766e">快照回滚</text>
  <rect x="514" y="118" width="136" height="40" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="582" y="143" text-anchor="middle" font-size="11" fill="#0f766e">依赖重建</text>
  <rect x="514" y="178" width="136" height="40" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="582" y="203" text-anchor="middle" font-size="11" fill="#0f766e">干净镜像重启</text>

  <text x="340" y="256" text-anchor="middle" font-size="12" fill="#64748b">自愈之后通常要回头改计划，因为前提已经不成立</text>
</svg>
