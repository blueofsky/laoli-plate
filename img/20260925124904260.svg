<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <rect width="680" height="430" fill="#ffffff"/>
  <text x="340" y="34" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">权限设计：默认拒绝 + 最小权限 + 判定维度</text>

  <rect x="230" y="54" width="220" height="40" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="340" y="79" font-size="14" font-weight="700" fill="#0f766e" text-anchor="middle">一次工具调用</text>

  <path d="M340 94 L340 126" stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#ah)"/>

  <polygon points="340,132 412,166 340,200 268,166" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="340" y="162" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">在白名单？</text>
  <text x="340" y="180" font-size="11" fill="#92400e" text-anchor="middle">deny-by-default</text>

  <path d="M412 166 L468 166" stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <path d="M268 166 L212 166" stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#ah)"/>

  <rect x="468" y="144" width="180" height="44" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="558" y="171" font-size="14" font-weight="700" fill="#0f766e" text-anchor="middle">放行（allow）</text>

  <rect x="32" y="144" width="180" height="44" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="122" y="171" font-size="14" font-weight="700" fill="#991b1b" text-anchor="middle">拒绝（deny）</text>

  <rect x="40" y="228" width="600" height="46" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="340" y="256" font-size="13" fill="#92400e" text-anchor="middle">最小权限 scopes：agent 用任务专属身份 + 窄 scope，不拿主密钥</text>

  <g>
    <rect x="40" y="300" width="116" height="48" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="98" y="329" font-size="13" font-weight="700" fill="#5b21b6" text-anchor="middle">per-tool</text>
  </g>
  <g>
    <rect x="170" y="300" width="116" height="48" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="228" y="329" font-size="13" font-weight="700" fill="#5b21b6" text-anchor="middle">per-action</text>
  </g>
  <g>
    <rect x="300" y="300" width="116" height="48" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="358" y="329" font-size="13" font-weight="700" fill="#5b21b6" text-anchor="middle">per-resource</text>
  </g>
  <g>
    <rect x="430" y="300" width="116" height="48" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="488" y="329" font-size="13" font-weight="700" fill="#5b21b6" text-anchor="middle">per-user</text>
  </g>
  <g>
    <rect x="560" y="300" width="116" height="48" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="618" y="329" font-size="13" font-weight="700" fill="#5b21b6" text-anchor="middle">per-context</text>
  </g>

  <text x="340" y="388" font-size="13" fill="#374151" text-anchor="middle">判定维度 × 默认拒绝 = 权限闸（模型不是 principal，agent 凭证执行、策略放行）</text>

  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#9ca3af"/>
    </marker>
  </defs>
</svg>
