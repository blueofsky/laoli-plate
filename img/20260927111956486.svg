<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="680" height="360" fill="#ffffff"/>
  <text x="340" y="30" text-anchor="middle" font-size="18" fill="#0f766e" font-weight="bold">无规划 vs 有规划 的 agent 行为对比</text>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#d97706"/></marker>
    <marker id="b" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#0d9488"/></marker>
  </defs>
  <rect x="20" y="55" width="310" height="285" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
  <text x="175" y="82" text-anchor="middle" font-size="15" fill="#92400e" font-weight="bold">无规划：走偏 · 重复 · 遇错不恢复</text>
  <circle cx="110" cy="175" r="26" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="110" y="180" text-anchor="middle" font-size="13" fill="#92400e">Agent</text>
  <rect x="200" y="115" width="105" height="30" rx="5" fill="#ffffff" stroke="#d97706"/>
  <text x="252" y="135" text-anchor="middle" font-size="11" fill="#92400e">拉数据</text>
  <rect x="200" y="165" width="105" height="30" rx="5" fill="#ffffff" stroke="#d97706"/>
  <text x="252" y="185" text-anchor="middle" font-size="11" fill="#92400e">拉数据(重复)</text>
  <rect x="200" y="215" width="105" height="30" rx="5" fill="#ffffff" stroke="#d97706"/>
  <text x="252" y="235" text-anchor="middle" font-size="11" fill="#92400e">发邮件</text>
  <rect x="200" y="265" width="105" height="28" rx="5" fill="#fee2e2" stroke="#dc2626"/>
  <text x="252" y="283" text-anchor="middle" font-size="11" fill="#b91c1c">走偏 / 死路</text>
  <line x1="136" y1="162" x2="200" y2="130" stroke="#d97706" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="136" y1="175" x2="200" y2="180" stroke="#d97706" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="136" y1="190" x2="200" y2="230" stroke="#d97706" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="136" y1="200" x2="200" y2="279" stroke="#dc2626" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="350" y="55" width="310" height="285" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="505" y="82" text-anchor="middle" font-size="15" fill="#0f766e" font-weight="bold">有规划：依赖有序 · 遇错回退</text>
  <circle cx="440" cy="175" r="26" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="440" y="180" text-anchor="middle" font-size="13" fill="#0f766e">Agent</text>
  <rect x="500" y="115" width="110" height="30" rx="5" fill="#ffffff" stroke="#0d9488"/>
  <text x="555" y="135" text-anchor="middle" font-size="11" fill="#0f766e">拉数据</text>
  <rect x="500" y="165" width="110" height="30" rx="5" fill="#ffffff" stroke="#0d9488"/>
  <text x="555" y="185" text-anchor="middle" font-size="11" fill="#0f766e">清洗</text>
  <rect x="500" y="215" width="110" height="30" rx="5" fill="#ffffff" stroke="#0d9488"/>
  <text x="555" y="235" text-anchor="middle" font-size="11" fill="#0f766e">出图</text>
  <rect x="500" y="265" width="110" height="28" rx="5" fill="#ffffff" stroke="#0d9488"/>
  <text x="555" y="283" text-anchor="middle" font-size="11" fill="#0f766e">发邮件</text>
  <line x1="466" y1="162" x2="500" y2="130" stroke="#0d9488" stroke-width="1.5" marker-end="url(#b)"/>
  <line x1="466" y1="175" x2="500" y2="180" stroke="#0d9488" stroke-width="1.5" marker-end="url(#b)"/>
  <line x1="466" y1="190" x2="500" y2="230" stroke="#0d9488" stroke-width="1.5" marker-end="url(#b)"/>
  <line x1="466" y1="200" x2="500" y2="279" stroke="#0d9488" stroke-width="1.5" marker-end="url(#b)"/>
</svg>
