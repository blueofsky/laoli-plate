<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <rect x="0" y="0" width="680" height="380" fill="#ffffff"/>
  <text x="340" y="36" font-size="22" font-weight="700" fill="#1f2937" text-anchor="middle">四框架窗口管理对照</text>
  <text x="340" y="60" font-size="13" fill="#6b7280" text-anchor="middle">续传 / 裁剪压缩 / 隔离缓存 三层能力的位置差异（版本锚定 2026-09）</text>

  <rect x="20" y="80" width="155" height="270" rx="12" fill="#f8fafc" stroke="#0d9488" stroke-width="1.5"/>
  <text x="97" y="108" font-size="14" font-weight="700" fill="#0f766e" text-anchor="middle">OpenAI</text>
  <text x="97" y="128" font-size="12" fill="#6b7280" text-anchor="middle">Agents SDK</text>
  <text x="97" y="162" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle">续传</text>
  <text x="97" y="182" font-size="11" fill="#6b7280" text-anchor="middle">Sessions 自动</text>
  <text x="97" y="198" font-size="11" fill="#6b7280" text-anchor="middle">维护跨 run</text>
  <text x="97" y="232" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle">裁剪</text>
  <text x="97" y="252" font-size="11" fill="#6b7280" text-anchor="middle">session_input</text>
  <text x="97" y="268" font-size="11" fill="#6b7280" text-anchor="middle">_callback</text>
  <text x="97" y="302" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle">隔离缓存</text>
  <text x="97" y="322" font-size="11" fill="#6b7280" text-anchor="middle">SandboxAgent</text>
  <text x="97" y="338" font-size="11" fill="#6b7280" text-anchor="middle">执行级隔离</text>

  <rect x="185" y="80" width="155" height="270" rx="12" fill="#f8fafc" stroke="#d97706" stroke-width="1.5"/>
  <text x="262" y="108" font-size="14" font-weight="700" fill="#92400e" text-anchor="middle">Anthropic</text>
  <text x="262" y="128" font-size="12" fill="#6b7280" text-anchor="middle">Claude</text>
  <text x="262" y="162" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle">续传</text>
  <text x="262" y="182" font-size="11" fill="#6b7280" text-anchor="middle">客户端维护</text>
  <text x="262" y="198" font-size="11" fill="#6b7280" text-anchor="middle">消息列表</text>
  <text x="262" y="232" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle">裁剪</text>
  <text x="262" y="252" font-size="11" fill="#6b7280" text-anchor="middle">由调用方控制</text>
  <text x="262" y="268" font-size="11" fill="#6b7280" text-anchor="middle">无内置</text>
  <text x="262" y="302" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle">隔离缓存</text>
  <text x="262" y="322" font-size="11" fill="#6b7280" text-anchor="middle">prompt caching</text>
  <text x="262" y="338" font-size="11" fill="#6b7280" text-anchor="middle">前缀缓存</text>

  <rect x="350" y="80" width="155" height="270" rx="12" fill="#f8fafc" stroke="#0d9488" stroke-width="1.5"/>
  <text x="427" y="108" font-size="14" font-weight="700" fill="#0f766e" text-anchor="middle">LangGraph</text>
  <text x="427" y="128" font-size="12" fill="#6b7280" text-anchor="middle">图编排</text>
  <text x="427" y="162" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle">续传</text>
  <text x="427" y="182" font-size="11" fill="#6b7280" text-anchor="middle">Checkpointer</text>
  <text x="427" y="198" font-size="11" fill="#6b7280" text-anchor="middle">全量留 state</text>
  <text x="427" y="232" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle">裁剪</text>
  <text x="427" y="252" font-size="11" fill="#6b7280" text-anchor="middle">trim_messages</text>
  <text x="427" y="268" font-size="11" fill="#6b7280" text-anchor="middle">+ 滚动摘要</text>
  <text x="427" y="302" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle">隔离缓存</text>
  <text x="427" y="322" font-size="11" fill="#6b7280" text-anchor="middle">裁剪只影响</text>
  <text x="427" y="338" font-size="11" fill="#6b7280" text-anchor="middle">LLM 输入</text>

  <rect x="515" y="80" width="155" height="270" rx="12" fill="#f8fafc" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="592" y="108" font-size="14" font-weight="700" fill="#5b21b6" text-anchor="middle">Letta</text>
  <text x="592" y="128" font-size="12" fill="#6b7280" text-anchor="middle">MemGPT 系</text>
  <text x="592" y="162" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle">续传</text>
  <text x="592" y="182" font-size="11" fill="#6b7280" text-anchor="middle">窗口 / 外部</text>
  <text x="592" y="198" font-size="11" fill="#6b7280" text-anchor="middle">显式分层</text>
  <text x="592" y="232" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle">裁剪</text>
  <text x="592" y="252" font-size="11" fill="#6b7280" text-anchor="middle">memory blocks</text>
  <text x="592" y="268" font-size="11" fill="#6b7280" text-anchor="middle">渐进式披露</text>
  <text x="592" y="302" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle">隔离缓存</text>
  <text x="592" y="322" font-size="11" fill="#6b7280" text-anchor="middle">memory tools</text>
  <text x="592" y="338" font-size="11" fill="#6b7280" text-anchor="middle">自管隔离</text>

  <text x="340" y="372" font-size="11" fill="#6b7280" text-anchor="middle">OpenAI 把续传与裁剪做成 SDK 内建；Anthropic 重在前缀缓存；LangGraph 把裁剪显式成节点；Letta 把上下文工程本身当内建能力</text>
</svg>
