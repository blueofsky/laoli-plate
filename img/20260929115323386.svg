<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="680" height="260" fill="#ffffff"/>
  <text x="20" y="36" font-size="15" font-weight="bold" fill="#0f766e">多智能体编排光谱（左 → 右 复杂度递增）</text>

  <!-- baseline arrow -->
  <line x1="30" y1="135" x2="650" y2="135" stroke="#94a3b8" stroke-width="2" marker-end="url(#bar)"/>

  <!-- nodes -->
  <rect x="30" y="105" width="120" height="54" rx="8" fill="#0f766e" stroke="#0f766e" stroke-width="2"/>
  <text x="90" y="135" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">SubAgent</text>

  <rect x="170" y="105" width="120" height="54" rx="8" fill="#0d9488" stroke="#0d9488" stroke-width="2"/>
  <text x="230" y="135" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Handoff</text>

  <rect x="310" y="105" width="120" height="54" rx="8" fill="#14b8a6" stroke="#0d9488" stroke-width="1.5"/>
  <text x="370" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Supervisor</text>
  <text x="370" y="146" text-anchor="middle" font-size="11" fill="#ffffff">GroupChat</text>

  <rect x="450" y="105" width="120" height="54" rx="8" fill="#5eead4" stroke="#0d9488" stroke-width="1.5"/>
  <text x="510" y="135" text-anchor="middle" font-size="14" font-weight="bold" fill="#134e4a">Swarm</text>

  <rect x="585" y="105" width="95" height="54" rx="8" fill="#99f6e4" stroke="#0d9488" stroke-width="1.5"/>
  <text x="632" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#134e4a">Agent</text>
  <text x="632" y="146" text-anchor="middle" font-size="11" fill="#134e4a">Teams</text>

  <!-- 管什么 captions -->
  <text x="90" y="185" text-anchor="middle" font-size="11.5" fill="#334155">父委派 · 子回摘要</text>
  <text x="230" y="185" text-anchor="middle" font-size="11.5" fill="#334155">控制权转移给专家</text>
  <text x="370" y="185" text-anchor="middle" font-size="11.5" fill="#334155">平级共享状态 · 协商</text>
  <text x="510" y="185" text-anchor="middle" font-size="11.5" fill="#334155">agent 间互转控制权</text>
  <text x="632" y="185" text-anchor="middle" font-size="11.5" fill="#334155">脚本驱动 · 互查</text>

  <!-- callouts -->
  <text x="90" y="220" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0f766e">← 本文主题 · 最简单</text>
  <text x="632" y="220" text-anchor="middle" font-size="11.5" fill="#64748b">最复杂 →</text>

  <defs>
    <marker id="bar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/></marker>
  </defs>
</svg>
