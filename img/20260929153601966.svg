<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="680" height="380" fill="#ffffff"/>
  <defs>
    <marker id="mTeal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#0d9488"/>
    </marker>
    <marker id="mPurple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <line x1="338" y1="52" x2="338" y2="356" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Left: execution graph -->
  <text x="20" y="36" font-size="14" font-weight="bold" fill="#0f766e">执行图（Execution Graph）</text>
  <rect x="60" y="86" width="90" height="36" rx="6" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="105" y="109" text-anchor="middle" font-size="12.5" fill="#134e4a">节点</text>
  <rect x="190" y="86" width="90" height="36" rx="6" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="235" y="109" text-anchor="middle" font-size="12.5" fill="#134e4a">节点</text>
  <rect x="120" y="176" width="90" height="36" rx="6" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="165" y="199" text-anchor="middle" font-size="12.5" fill="#134e4a">节点</text>
  <line x1="150" y1="104" x2="190" y2="104" stroke="#0d9488" stroke-width="2" marker-end="url(#mTeal)"/>
  <path d="M105,122 L150,176" fill="none" stroke="#0d9488" stroke-width="2" marker-end="url(#mTeal)"/>
  <path d="M235,122 L180,176" fill="none" stroke="#0d9488" stroke-width="2" marker-end="url(#mTeal)"/>
  <rect x="50" y="290" width="250" height="40" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="175" y="315" text-anchor="middle" font-size="12.5" fill="#5b21b6">共享 state（每步 checkpoint）</text>
  <line x1="165" y1="212" x2="165" y2="290" stroke="#7c3aed" stroke-width="2" marker-end="url(#mPurple)"/>
  <text x="175" y="262" text-anchor="middle" font-size="12" fill="#b45309">条件边决定下一步</text>

  <!-- Right: supervisor hierarchy -->
  <text x="360" y="36" font-size="14" font-weight="bold" fill="#0f766e">监督层级（Supervisor Hierarchy）</text>
  <rect x="450" y="86" width="120" height="36" rx="6" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="510" y="109" text-anchor="middle" font-size="12.5" fill="#0f766e">supervisor</text>
  <rect x="378" y="196" width="110" height="36" rx="6" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="433" y="219" text-anchor="middle" font-size="12.5" fill="#134e4a">worker</text>
  <rect x="532" y="196" width="110" height="36" rx="6" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="587" y="219" text-anchor="middle" font-size="12.5" fill="#134e4a">worker</text>
  <path d="M480,122 L433,196" fill="none" stroke="#0d9488" stroke-width="2" marker-end="url(#mTeal)"/>
  <path d="M540,122 L587,196" fill="none" stroke="#0d9488" stroke-width="2" marker-end="url(#mTeal)"/>
  <text x="510" y="290" text-anchor="middle" font-size="12" fill="#b45309">分解 · 委派 · 汇总</text>
  <text x="510" y="312" text-anchor="middle" font-size="12" fill="#6b7280">manager 持任务与状态</text>
</svg>
