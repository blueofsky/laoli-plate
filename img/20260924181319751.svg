<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <rect x="0" y="0" width="680" height="300" fill="#ffffff"/>
  <text x="340" y="40" font-size="22" font-weight="700" fill="#1f2937" text-anchor="middle">长时记忆生命周期流水线</text>
  <text x="340" y="66" font-size="13" fill="#6b7280" text-anchor="middle">捕获 → 存储 → 检索 → 注入 → 遗忘，每一段都可被工程化</text>

  <rect x="20" y="130" width="104" height="90" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="72" y="162" font-size="15" font-weight="700" fill="#0f766e" text-anchor="middle">捕获</text>
  <text x="72" y="184" font-size="10" fill="#6b7280" text-anchor="middle">同步 / 摘要</text>
  <text x="72" y="200" font-size="10" fill="#6b7280" text-anchor="middle">/ 异步流水线</text>

  <rect x="142" y="130" width="104" height="90" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="194" y="162" font-size="15" font-weight="700" fill="#92400e" text-anchor="middle">存储</text>
  <text x="194" y="184" font-size="10" fill="#6b7280" text-anchor="middle">向量 / KV</text>
  <text x="194" y="200" font-size="10" fill="#6b7280" text-anchor="middle">/ 图</text>

  <rect x="264" y="130" width="104" height="90" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="316" y="162" font-size="15" font-weight="700" fill="#5b21b6" text-anchor="middle">检索</text>
  <text x="316" y="184" font-size="10" fill="#6b7280" text-anchor="middle">相似度 + 新鲜度</text>
  <text x="316" y="200" font-size="10" fill="#6b7280" text-anchor="middle">+ 重要性</text>

  <rect x="386" y="130" width="104" height="90" rx="12" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="438" y="162" font-size="15" font-weight="700" fill="#065f46" text-anchor="middle">注入</text>
  <text x="438" y="184" font-size="10" fill="#6b7280" text-anchor="middle">系统提示 / 工具区</text>
  <text x="438" y="200" font-size="10" fill="#6b7280" text-anchor="middle">受 token 预算</text>

  <rect x="508" y="130" width="104" height="90" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="560" y="162" font-size="15" font-weight="700" fill="#991b1b" text-anchor="middle">遗忘</text>
  <text x="560" y="184" font-size="10" fill="#6b7280" text-anchor="middle">TTL / 去重</text>
  <text x="560" y="200" font-size="10" fill="#6b7280" text-anchor="middle">/ 冲突消解</text>

  <path d="M124 175 L140 175" stroke="#9ca3af" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M246 175 L262 175" stroke="#9ca3af" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M368 175 L384 175" stroke="#9ca3af" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M490 175 L506 175" stroke="#9ca3af" stroke-width="2" marker-end="url(#ah)"/>

  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#9ca3af"/>
    </marker>
  </defs>
</svg>
