<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="680" height="440" fill="#ffffff"/>
  <text x="340" y="28" text-anchor="middle" font-size="17" fill="#0f766e" font-weight="bold">执行环境的两件事：agent 逻辑不变，变的是「在哪执行」</text>
  <defs>
    <marker id="c" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#475569"/></marker>
  </defs>

  <rect x="180" y="44" width="320" height="42" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <text x="340" y="64" text-anchor="middle" font-size="12" fill="#334155" font-weight="bold">agent 逻辑</text>
  <text x="340" y="80" text-anchor="middle" font-size="10" fill="#334155">不改一行</text>

  <line x1="280" y1="88" x2="192" y2="118" stroke="#475569" stroke-width="1.8" marker-end="url(#c)"/>
  <line x1="400" y1="88" x2="488" y2="118" stroke="#475569" stroke-width="1.8" marker-end="url(#c)"/>

  <rect x="30" y="122" width="300" height="228" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="46" y="148" font-size="12" fill="#92400e" font-weight="bold">问题一 · 文件与产物放在哪</text>
  <text x="46" y="166" font-size="10" fill="#a16207">把文件操作从本地磁盘解绑</text>

  <text x="46" y="194" font-size="10.5" fill="#92400e" font-weight="bold">deepagents</text>
  <text x="46" y="208" font-size="9.5" fill="#a16207">Backend 族：State、Filesystem、Store、Composite</text>
  <text x="46" y="234" font-size="10.5" fill="#92400e" font-weight="bold">Google ADK</text>
  <text x="46" y="248" font-size="9.5" fill="#a16207">ArtifactService：内存、GCS、文件</text>
  <text x="46" y="274" font-size="10.5" fill="#92400e" font-weight="bold">OpenAI Agents SDK</text>
  <text x="46" y="288" font-size="9.5" fill="#a16207">Manifest：root、mounts、输出目录</text>
  <text x="46" y="314" font-size="10.5" fill="#92400e" font-weight="bold">Anthropic Claude</text>
  <text x="46" y="328" font-size="9.5" fill="#a16207">目录约定：/workspace、/mnt/session/outputs</text>

  <rect x="350" y="122" width="300" height="228" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="366" y="148" font-size="12" fill="#0f766e" font-weight="bold">问题二 · 代码在哪跑</text>
  <text x="366" y="166" font-size="10" fill="#0d9488">沙箱与运行时后端可替换</text>

  <text x="366" y="194" font-size="10.5" fill="#0f766e" font-weight="bold">OpenAI Agents SDK</text>
  <text x="366" y="208" font-size="9.5" fill="#0d9488">sandbox client：UnixLocal、Docker、E2B …</text>
  <text x="366" y="234" font-size="10.5" fill="#0f766e" font-weight="bold">AgentScope 2.0</text>
  <text x="366" y="248" font-size="9.5" fill="#0d9488">Workspace：8 个实现 + execution backend</text>
  <text x="366" y="274" font-size="10.5" fill="#0f766e" font-weight="bold">smolagents</text>
  <text x="366" y="288" font-size="9.5" fill="#0d9488">PythonExecutor：本地 AST 白名单、Docker …</text>
  <text x="366" y="314" font-size="10.5" fill="#0f766e" font-weight="bold">AutoGen / AG2</text>
  <text x="366" y="328" font-size="9.5" fill="#0d9488">CodeExecutor：本地、Docker、Daytona …</text>

  <rect x="30" y="366" width="620" height="54" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="340" y="388" text-anchor="middle" font-size="10" fill="#475569">同一批沙箱厂商（E2B / Daytona / Modal / Blaxel / Runloop）被多家框架当后端接入</text>
  <text x="340" y="406" text-anchor="middle" font-size="10" fill="#475569">两个问题各自独立替换：换存储不动运行时，换运行时不动存储</text>
</svg>
