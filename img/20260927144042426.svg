<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 370" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="680" height="370" fill="#ffffff"/>
  <text x="340" y="30" text-anchor="middle" font-size="18" fill="#0f766e" font-weight="bold">终端会话：双向流、流控、按进程组回收</text>
  <defs>
    <marker id="c" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#475569"/></marker>
  </defs>

  <rect x="28" y="120" width="112" height="62" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <text x="84" y="146" text-anchor="middle" font-size="12" fill="#334155" font-weight="bold">agent</text>
  <text x="84" y="167" text-anchor="middle" font-size="10" fill="#334155">发送指令</text>
  <line x1="140" y1="151" x2="174" y2="151" stroke="#475569" stroke-width="2" marker-end="url(#c)"/>

  <rect x="178" y="96" width="300" height="110" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="328" y="124" text-anchor="middle" font-size="13" fill="#0f766e" font-weight="bold">PTY 会话</text>
  <text x="328" y="146" text-anchor="middle" font-size="10.5" fill="#0f766e">/bin/bash -i -l · 交互式 + 登录 shell</text>
  <text x="328" y="170" text-anchor="middle" font-size="10.5" fill="#0f766e">输出走 pty 通道，带终端控制序列</text>
  <text x="328" y="192" text-anchor="middle" font-size="10.5" fill="#0f766e">会话保持：目录 / 环境变量 / 依赖</text>

  <line x1="478" y1="151" x2="502" y2="151" stroke="#475569" stroke-width="2" marker-end="url(#c)"/>
  <rect x="506" y="120" width="146" height="62" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <text x="579" y="146" text-anchor="middle" font-size="11.5" fill="#334155" font-weight="bold">上层 UI</text>
  <text x="579" y="167" text-anchor="middle" font-size="10" fill="#334155">SSE / WebSocket 流式</text>

  <line x1="240" y1="208" x2="240" y2="248" stroke="#475569" stroke-width="2" marker-end="url(#c)"/>
  <line x1="400" y1="208" x2="400" y2="248" stroke="#475569" stroke-width="2" marker-end="url(#c)"/>

  <rect x="178" y="252" width="116" height="62" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <text x="236" y="274" text-anchor="middle" font-size="11.5" fill="#334155" font-weight="bold">取消与 Kill</text>
  <text x="236" y="293" text-anchor="middle" font-size="10" fill="#334155">按进程组回收整棵树</text>
  <text x="236" y="308" text-anchor="middle" font-size="10" fill="#334155">不能只杀一个 PID</text>

  <rect x="306" y="252" width="172" height="62" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="392" y="274" text-anchor="middle" font-size="11.5" fill="#92400e" font-weight="bold">缓冲流控</text>
  <text x="392" y="293" text-anchor="middle" font-size="10" fill="#92400e">背压 · 环形缓冲 / 滑动窗口</text>
  <text x="392" y="308" text-anchor="middle" font-size="10" fill="#92400e">超限截断保留首尾</text>

  <text x="340" y="348" text-anchor="middle" font-size="12" fill="#64748b">会话能断开重连，也能被按进程组取消</text>
</svg>
