<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="680" height="440" fill="#ffffff"/>
  <defs>
    <marker id="mTeal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#0d9488"/>
    </marker>
    <marker id="mGray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- ① 交任务 -->
  <rect x="180" y="30" width="280" height="44" rx="6" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="320" y="57" text-anchor="middle" font-size="12.5" fill="#134e4a">① 你交任务：订下周去上海最便宜的航班</text>
  <line x1="320" y1="74" x2="320" y2="106" stroke="#0d9488" stroke-width="1.5" marker-end="url(#mTeal)"/>

  <!-- ② 组装上下文 -->
  <rect x="180" y="108" width="280" height="44" rx="6" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="320" y="135" text-anchor="middle" font-size="12.5" fill="#134e4a">② 已知信息重新摆上桌面（组装上下文）</text>
  <line x1="320" y1="152" x2="320" y2="182" stroke="#0d9488" stroke-width="1.5" marker-end="url(#mTeal)"/>

  <!-- ③ 思考 -->
  <rect x="180" y="184" width="280" height="50" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="320" y="214" text-anchor="middle" font-size="12.5" fill="#4c1d95">③ 模型盘算：还差什么、够不够（思考）</text>
  <line x1="320" y1="234" x2="320" y2="284" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#mGray)"/>
  <text x="330" y="264" font-size="11.5" fill="#6d28d9">不够：不知道价格，得去查</text>

  <!-- ④ 调用工具 -->
  <rect x="180" y="286" width="280" height="44" rx="6" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="320" y="313" text-anchor="middle" font-size="12.5" fill="#134e4a">④ 模型打电话查航班（调用工具）</text>
  <line x1="320" y1="330" x2="320" y2="370" stroke="#0d9488" stroke-width="1.5" marker-end="url(#mTeal)"/>

  <!-- ⑤ 观察结果 -->
  <rect x="180" y="372" width="280" height="44" rx="6" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="320" y="399" text-anchor="middle" font-size="12.5" fill="#134e4a">⑤ 模型拿到报价清单（观察结果）</text>

  <!-- 回环 ⑤ → ② -->
  <path d="M180,394 L140,394 L140,130 L178,130" fill="none" stroke="#d97706" stroke-width="1.8" marker-end="url(#mGray)"/>
  <text x="134" y="256" text-anchor="end" font-size="11.5" fill="#b45309">② ~ ⑤</text>
  <text x="134" y="274" text-anchor="end" font-size="11.5" fill="#b45309">反复打转</text>

  <!-- 够了 → ⑥ -->
  <line x1="460" y1="209" x2="498" y2="209" stroke="#0d9488" stroke-width="1.5" marker-end="url(#mTeal)"/>
  <text x="479" y="199" text-anchor="middle" font-size="11.5" fill="#0f766e">够了</text>
  <rect x="500" y="187" width="160" height="44" rx="6" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="580" y="214" text-anchor="middle" font-size="12.5" fill="#134e4a">⑥ 模型给出最终方案</text>
</svg>