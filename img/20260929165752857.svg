<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="680" height="300" fill="#ffffff"/>
  <defs>
    <marker id="mTealR" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#0d9488"/></marker>
  </defs>

  <text x="20" y="36" font-size="15" font-weight="bold" fill="#0f766e">共享状态的合并方式：后写覆盖与按规则叠加</text>

  <text x="175" y="76" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">无 reducer（默认后写覆盖）</text>
  <rect x="58" y="88" width="104" height="36" rx="6" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="110" y="111" font-size="13" fill="#134e4a" text-anchor="middle">agent A</text>
  <rect x="188" y="88" width="104" height="36" rx="6" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="240" y="111" font-size="13" fill="#134e4a" text-anchor="middle">agent B</text>
  <line x1="110" y1="124" x2="110" y2="156" stroke="#0d9488" stroke-width="2" marker-end="url(#mTealR)"/>
  <line x1="240" y1="124" x2="240" y2="156" stroke="#0d9488" stroke-width="2" marker-end="url(#mTealR)"/>
  <rect x="35" y="156" width="280" height="62" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="175" y="179" font-size="11.5" fill="#92400e" text-anchor="middle">state.messages</text>
  <text x="175" y="201" font-size="12.5" fill="#92400e" text-anchor="middle">["B 的结果"]</text>
  <text x="175" y="244" font-size="12.5" font-weight="bold" fill="#b45309" text-anchor="middle">A 的结果丢失</text>

  <text x="505" y="76" font-size="14" font-weight="bold" fill="#0f766e" text-anchor="middle">有 reducer（按规则叠加）</text>
  <rect x="388" y="88" width="104" height="36" rx="6" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="440" y="111" font-size="13" fill="#134e4a" text-anchor="middle">agent A</text>
  <rect x="518" y="88" width="104" height="36" rx="6" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="570" y="111" font-size="13" fill="#134e4a" text-anchor="middle">agent B</text>
  <line x1="440" y1="124" x2="440" y2="156" stroke="#0d9488" stroke-width="2" marker-end="url(#mTealR)"/>
  <line x1="570" y1="124" x2="570" y2="156" stroke="#0d9488" stroke-width="2" marker-end="url(#mTealR)"/>
  <rect x="365" y="156" width="280" height="62" rx="6" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="505" y="179" font-size="11.5" fill="#0f766e" text-anchor="middle">state.messages</text>
  <text x="505" y="201" font-size="12.5" fill="#134e4a" text-anchor="middle">["A 的结果", "B 的结果"]</text>
  <text x="505" y="244" font-size="12.5" font-weight="bold" fill="#0f766e" text-anchor="middle">两个结果都在</text>

  <text x="20" y="280" font-size="12" fill="#6b7280">合并方式由 reducer 指定（LangGraph：add_messages 追加消息，operator.add 相加数值）</text>
</svg>
