<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <rect x="0" y="0" width="680" height="400" fill="#ffffff"/>
  <text x="340" y="42" font-size="22" font-weight="700" fill="#1f2937" text-anchor="middle">Skill 内部结构</text>
  <text x="340" y="68" font-size="13" fill="#6b7280" text-anchor="middle">带说明书的能力包，不是更聪明的工具</text>

  <!-- central box -->
  <rect x="225" y="110" width="230" height="180" rx="16" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="340" y="150" font-size="18" font-weight="700" fill="#0f766e" text-anchor="middle">Skill 能力包</text>
  <text x="340" y="178" font-size="12" fill="#6b7280" text-anchor="middle">名字即可调用</text>
  <text x="340" y="200" font-size="12" fill="#6b7280" text-anchor="middle">规定「由哪些 tool 组成</text>
  <text x="340" y="220" font-size="12" fill="#6b7280" text-anchor="middle">按什么步骤做</text>
  <text x="340" y="242" font-size="12" fill="#6b7280" text-anchor="middle">上下文怎么按需取」</text>
  <text x="340" y="268" font-size="11" fill="#9ca3af" text-anchor="middle">不规定 tool 怎么执行</text>

  <!-- four compartments -->
  <rect x="30" y="300" width="140" height="64" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="100" y="328" font-size="14" font-weight="700" fill="#92400e" text-anchor="middle">tools</text>
  <text x="100" y="350" font-size="11" fill="#6b7280" text-anchor="middle">原子工具集合</text>

  <rect x="190" y="300" width="140" height="64" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="260" y="328" font-size="14" font-weight="700" fill="#5b21b6" text-anchor="middle">procedure</text>
  <text x="260" y="350" font-size="11" fill="#6b7280" text-anchor="middle">怎么做的过程</text>

  <rect x="350" y="300" width="140" height="64" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="420" y="328" font-size="14" font-weight="700" fill="#1e40af" text-anchor="middle">instructions</text>
  <text x="420" y="350" font-size="11" fill="#6b7280" text-anchor="middle">给模型的指令</text>

  <rect x="510" y="300" width="140" height="64" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="580" y="328" font-size="14" font-weight="700" fill="#991b1b" text-anchor="middle">resources</text>
  <text x="580" y="350" font-size="11" fill="#6b7280" text-anchor="middle">按需加载</text>

  <!-- connectors -->
  <path d="M100 300 L340 290" stroke="#9ca3af" stroke-width="1.5" fill="none"/>
  <path d="M260 300 L340 290" stroke="#9ca3af" stroke-width="1.5" fill="none"/>
  <path d="M420 300 L340 290" stroke="#9ca3af" stroke-width="1.5" fill="none"/>
  <path d="M580 300 L340 290" stroke="#9ca3af" stroke-width="1.5" fill="none"/>
</svg>
