<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <rect width="680" height="440" fill="#ffffff"/>
  <text x="340" y="34" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">工具调用的副作用出口与四类威胁</text>

  <rect x="230" y="60" width="220" height="40" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="340" y="85" font-size="14" font-weight="700" fill="#0f766e" text-anchor="middle">模型决定调用工具</text>

  <rect x="200" y="124" width="280" height="50" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="340" y="146" font-size="14" font-weight="700" fill="#92400e" text-anchor="middle">执行 → 真实系统</text>
  <text x="340" y="165" font-size="12" fill="#92400e" text-anchor="middle">产生副作用：写库 / 发消息 / 删文件 / 跑代码</text>

  <g>
    <rect x="38" y="234" width="140" height="62" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="108" y="260" font-size="14" font-weight="700" fill="#991b1b" text-anchor="middle">注入劫持</text>
    <text x="108" y="282" font-size="11" fill="#7f1d1d" text-anchor="middle">工具返回夹带指令</text>
  </g>
  <g>
    <rect x="192" y="234" width="140" height="62" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="262" y="260" font-size="14" font-weight="700" fill="#991b1b" text-anchor="middle">幻觉 / 误判</text>
    <text x="262" y="282" font-size="11" fill="#7f1d1d" text-anchor="middle">调错工具 / 参数过宽</text>
  </g>
  <g>
    <rect x="346" y="234" width="140" height="62" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="416" y="260" font-size="14" font-weight="700" fill="#991b1b" text-anchor="middle">越权 / 逃逸</text>
    <text x="416" y="282" font-size="11" fill="#7f1d1d" text-anchor="middle">凭证过多 / 沙箱没封</text>
  </g>
  <g>
    <rect x="500" y="234" width="140" height="62" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="570" y="260" font-size="14" font-weight="700" fill="#991b1b" text-anchor="middle">凭证泄露</text>
    <text x="570" y="282" font-size="11" fill="#7f1d1d" text-anchor="middle">回秘密 / 主密钥进 prompt</text>
  </g>

  <path d="M290 174 L108 232" stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <path d="M320 174 L262 232" stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <path d="M360 174 L416 232" stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <path d="M390 174 L570 232" stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#ah)"/>

  <text x="340" y="338" font-size="13" fill="#374151" text-anchor="middle">四类不在同层 → 一道闸堵不全</text>
  <rect x="140" y="356" width="400" height="42" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="340" y="382" font-size="13" fill="#334155" text-anchor="middle">权限 / 沙箱 / HITL 是三道正交互补的执行前闸</text>

  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#9ca3af"/>
    </marker>
  </defs>
</svg>
