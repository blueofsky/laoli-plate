<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 410" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <rect x="0" y="0" width="680" height="410" fill="#ffffff"/>
  <text x="340" y="36" font-size="22" font-weight="700" fill="#1f2937" text-anchor="middle">压缩 vs 检索 决策树</text>

  <rect x="230" y="58" width="220" height="46" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="340" y="86" font-size="14" font-weight="700" fill="#0f766e" text-anchor="middle">窗口超预算？</text>

  <rect x="40" y="148" width="220" height="46" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="150" y="176" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">缺空间？历史冗余</text>

  <rect x="420" y="148" width="220" height="46" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="530" y="176" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">缺内容？知识缺失</text>

  <rect x="40" y="244" width="240" height="58" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="160" y="270" font-size="13" font-weight="700" fill="#0f766e" text-anchor="middle">压缩</text>
  <text x="160" y="290" font-size="11" fill="#6b7280" text-anchor="middle">滚动摘要 / 滑动窗口</text>

  <rect x="400" y="244" width="240" height="58" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="520" y="270" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">检索</text>
  <text x="520" y="290" font-size="11" fill="#6b7280" text-anchor="middle">Memory / Skill / RAG</text>

  <path d="M260 104 L150 146" stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <path d="M420 104 L530 146" stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <path d="M150 194 L160 242" stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <path d="M530 194 L520 242" stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#ah)"/>

  <text x="340" y="330" font-size="12" fill="#374151" text-anchor="middle">与上面正交的第二个维度：按内容动静分流</text>

  <rect x="40" y="342" width="280" height="52" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="180" y="366" font-size="13" font-weight="700" fill="#5b21b6" text-anchor="middle">动态内容</text>
  <text x="180" y="384" font-size="11" fill="#6b7280" text-anchor="middle">→ 隔离 / 临时注入</text>

  <rect x="360" y="342" width="280" height="52" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="500" y="366" font-size="13" font-weight="700" fill="#5b21b6" text-anchor="middle">静态内容</text>
  <text x="500" y="384" font-size="11" fill="#6b7280" text-anchor="middle">→ 前缀缓存（接第 17 期）</text>

  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#9ca3af"/>
    </marker>
  </defs>
</svg>
