<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="680" height="300" fill="#ffffff"/>
  <text x="340" y="28" text-anchor="middle" font-size="18" fill="#0f766e" font-weight="bold">规划形态谱系：静态 → 动态 → 分层·混合</text>
  <defs>
    <marker id="d" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#0d9488"/></marker>
    <marker id="e" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#d97706"/></marker>
    <marker id="f" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7c3aed"/></marker>
  </defs>
  <rect x="20" y="50" width="200" height="210" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="120" y="74" text-anchor="middle" font-size="14" fill="#0f766e" font-weight="bold">静态 plan-and-execute</text>
  <circle cx="60" cy="120" r="16" fill="#ccfbf1" stroke="#0d9488"/>
  <text x="60" y="124" text-anchor="middle" font-size="11" fill="#0f766e">A</text>
  <circle cx="120" cy="120" r="16" fill="#ccfbf1" stroke="#0d9488"/>
  <text x="120" y="124" text-anchor="middle" font-size="11" fill="#0f766e">B</text>
  <circle cx="180" cy="120" r="16" fill="#ccfbf1" stroke="#0d9488"/>
  <text x="180" y="124" text-anchor="middle" font-size="11" fill="#0f766e">C</text>
  <line x1="76" y1="120" x2="104" y2="120" stroke="#0d9488" stroke-width="1.5" marker-end="url(#d)"/>
  <line x1="136" y1="120" x2="164" y2="120" stroke="#0d9488" stroke-width="1.5" marker-end="url(#d)"/>
  <text x="120" y="170" text-anchor="middle" font-size="11" fill="#0f766e">先想全再执行</text>
  <text x="120" y="194" text-anchor="middle" font-size="11" fill="#0f766e">可控 · 省 token</text>
  <text x="120" y="218" text-anchor="middle" font-size="11" fill="#0f766e">僵：意外要重来</text>
  <rect x="240" y="50" width="200" height="210" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
  <text x="340" y="74" text-anchor="middle" font-size="14" fill="#92400e" font-weight="bold">动态 ReAct</text>
  <rect x="270" y="110" width="80" height="30" rx="5" fill="#fef3c7" stroke="#d97706"/>
  <text x="310" y="130" text-anchor="middle" font-size="11" fill="#92400e">think</text>
  <rect x="350" y="190" width="80" height="30" rx="5" fill="#fef3c7" stroke="#d97706"/>
  <text x="390" y="210" text-anchor="middle" font-size="11" fill="#92400e">act</text>
  <path d="M350,125 C390,140 400,170 390,190" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#e)"/>
  <path d="M350,205 C310,220 300,150 310,140" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#e)"/>
  <text x="340" y="170" text-anchor="middle" font-size="11" fill="#92400e">边做边想</text>
  <text x="340" y="244" text-anchor="middle" font-size="11" fill="#92400e">灵活 · 易打转</text>
  <rect x="460" y="50" width="200" height="210" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="560" y="72" text-anchor="middle" font-size="14" fill="#5b21b6" font-weight="bold">分层·混合</text>
  <circle cx="510" cy="110" r="14" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="510" y="114" text-anchor="middle" font-size="10" fill="#5b21b6">A</text>
  <circle cx="610" cy="110" r="14" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="610" y="114" text-anchor="middle" font-size="10" fill="#5b21b6">B</text>
  <line x1="524" y1="110" x2="596" y2="110" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#f)"/>
  <rect x="490" y="148" width="140" height="62" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-dasharray="4"/>
  <text x="560" y="170" text-anchor="middle" font-size="10" fill="#5b21b6">节点内</text>
  <text x="560" y="188" text-anchor="middle" font-size="10" fill="#5b21b6">局部 ReAct</text>
  <text x="560" y="206" text-anchor="middle" font-size="10" fill="#5b21b6">试错 / 纠错</text>
  <line x1="610" y1="124" x2="600" y2="148" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="3"/>
  <text x="560" y="244" text-anchor="middle" font-size="11" fill="#5b21b6">顶层 DAG + 节点内动态</text>
  <text x="340" y="288" text-anchor="middle" font-size="12" fill="#64748b">谱系的三个落点，按任务尺度混合</text>
