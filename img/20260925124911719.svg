<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <rect width="680" height="480" fill="#ffffff"/>
  <text x="340" y="34" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">编排决策流：动作按后果分级 → 控制组合</text>

  <rect x="240" y="48" width="200" height="38" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="340" y="72" font-size="14" font-weight="700" fill="#0f766e" text-anchor="middle">一个工具调用</text>

  <g>
    <rect x="30" y="110" width="210" height="52" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="44" y="132" font-size="13" font-weight="700" fill="#92400e">低 · 只读本地低爆</text>
    <text x="44" y="151" font-size="11" fill="#92400e">读公开文件</text>
    <path d="M240 136 L262 136" stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#ah)"/>
    <rect x="266" y="110" width="384" height="52" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
    <text x="280" y="140" font-size="13" fill="#0f766e">直跑；权限白名单兜住（不需沙箱 / 人）</text>
  </g>

  <g>
    <rect x="30" y="174" width="210" height="52" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="44" y="196" font-size="13" font-weight="700" fill="#92400e">中 · 网络读 / 不可信源</text>
    <text x="44" y="215" font-size="11" fill="#92400e">读外网</text>
    <path d="M240 200 L262 200" stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#ah)"/>
    <rect x="266" y="174" width="384" height="52" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
    <text x="280" y="204" font-size="13" fill="#0f766e">进沙箱（封网 · 无凭证）；出沙箱再核</text>
  </g>

  <g>
    <rect x="30" y="238" width="210" height="52" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="44" y="260" font-size="13" font-weight="700" fill="#92400e">中高 · 写自己沙箱文件</text>
    <text x="44" y="279" font-size="11" fill="#92400e">限定路径写</text>
    <path d="M240 264 L262 264" stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#ah)"/>
    <rect x="266" y="238" width="384" height="52" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
    <text x="280" y="268" font-size="13" fill="#0f766e">权限（授权 + 限定路径）+ 沙箱</text>
  </g>

  <g>
    <rect x="30" y="302" width="210" height="52" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="44" y="324" font-size="13" font-weight="700" fill="#92400e">高 · 删 / 发 / 转 / 执</text>
    <text x="44" y="343" font-size="11" fill="#92400e">不可逆 / 外部可见</text>
    <path d="M240 328 L262 328" stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#ah)"/>
    <rect x="266" y="302" width="384" height="52" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="280" y="332" font-size="13" fill="#5b21b6">HITL + 沙箱 + 审计（人批前提、范围兜底、留痕）</text>
  </g>

  <g>
    <rect x="30" y="366" width="210" height="52" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="44" y="388" font-size="13" font-weight="700" fill="#991b1b">极高 · 高代价 / 跨租户</text>
    <text x="44" y="407" font-size="11" fill="#7f1d1d">生产写</text>
    <path d="M240 392 L262 392" stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#ah)"/>
    <rect x="266" y="366" width="384" height="52" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="280" y="396" font-size="13" fill="#5b21b6">同步 HITL + 沙箱 + 全量审计 + 批后重校验</text>
  </g>

  <text x="340" y="450" font-size="13" fill="#374151" text-anchor="middle">审计日志贯穿所有档（事后取证，不拦动作）；风险越高叠闸越多、HITL 越靠前</text>

  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#9ca3af"/>
    </marker>
  </defs>
</svg>
