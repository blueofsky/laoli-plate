<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="680" height="290" fill="#ffffff"/>
  <defs>
    <marker id="mGrayR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/></marker>
  </defs>

  <text x="20" y="36" font-size="15" font-weight="bold" fill="#0f766e">路由的三种定法：灵活与可控两端</text>

  <text x="20" y="78" font-size="12" fill="#64748b">灵活度高</text>
  <text x="660" y="78" font-size="12" fill="#64748b" text-anchor="end">可控性高</text>
  <line x1="20" y1="92" x2="660" y2="92" stroke="#94a3b8" stroke-width="2" marker-end="url(#mGrayR)"/>

  <rect x="20" y="110" width="190" height="48" rx="6" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/>
  <text x="115" y="135" font-size="13.5" font-weight="bold" fill="#ffffff" text-anchor="middle">LLM 决策路由</text>

  <rect x="245" y="110" width="190" height="48" rx="6" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="340" y="135" font-size="13.5" font-weight="bold" fill="#134e4a" text-anchor="middle">规则或预设</text>

  <rect x="470" y="110" width="190" height="48" rx="6" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="565" y="135" font-size="13.5" font-weight="bold" fill="#134e4a" text-anchor="middle">静态图</text>

  <text x="115" y="186" font-size="12" fill="#334155" text-anchor="middle">每次路由一次模型调用</text>
  <text x="115" y="205" font-size="12" fill="#334155" text-anchor="middle">可能选错、可能反复</text>
  <text x="340" y="186" font-size="12" fill="#334155" text-anchor="middle">规则透明、可解释</text>
  <text x="340" y="205" font-size="12" fill="#334155" text-anchor="middle">表达力有限</text>
  <text x="565" y="186" font-size="12" fill="#334155" text-anchor="middle">确定性强、可测</text>
  <text x="565" y="205" font-size="12" fill="#334155" text-anchor="middle">不耗 token，无兜底分支</text>

  <line x1="20" y1="228" x2="660" y2="228" stroke="#e5e7eb" stroke-width="1"/>

  <text x="115" y="250" font-size="12" fill="#64748b" text-anchor="middle">LangGraph supervisor</text>
  <text x="115" y="268" font-size="12" fill="#64748b" text-anchor="middle">OpenAI Agents SDK handoff</text>
  <text x="340" y="250" font-size="12" fill="#64748b" text-anchor="middle">AG2 speaker selection</text>
  <text x="340" y="268" font-size="12" fill="#64748b" text-anchor="middle">CrewAI hierarchical</text>
  <text x="565" y="250" font-size="12" fill="#64748b" text-anchor="middle">LangGraph 条件边</text>
  <text x="565" y="268" font-size="12" fill="#64748b" text-anchor="middle">Google ADK 模板 workflow</text>
</svg>
