<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="680" height="400" fill="#ffffff"/>
  <text x="340" y="28" text-anchor="middle" font-size="18" fill="#0f766e" font-weight="bold">计划的表示与持有 + replanning 回路（含思考等级 escalate）</text>
  <defs>
    <marker id="g" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#0d9488"/></marker>
    <marker id="h" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7c3aed"/></marker>
  </defs>
  <!-- 持有位置 -->
  <rect x="30" y="48" width="180" height="56" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="120" y="72" text-anchor="middle" font-size="13" fill="#0f766e" font-weight="bold">scratchpad</text>
  <text x="120" y="92" text-anchor="middle" font-size="10" fill="#0f766e">模型草稿区</text>
  <rect x="250" y="48" width="180" height="56" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="340" y="72" text-anchor="middle" font-size="13" fill="#0f766e" font-weight="bold">会话态</text>
  <text x="340" y="92" text-anchor="middle" font-size="10" fill="#0f766e">框架管理</text>
  <rect x="470" y="48" width="180" height="56" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="560" y="72" text-anchor="middle" font-size="13" fill="#0f766e" font-weight="bold">上下文窗口</text>
  <text x="560" y="92" text-anchor="middle" font-size="10" fill="#0f766e">拼进每轮 prompt</text>
  <!-- 三框桥接计划节点 -->
  <text x="340" y="122" text-anchor="middle" font-size="11" fill="#0d9488">计划以以上三种形式持有</text>
  <line x1="340" y1="128" x2="340" y2="146" stroke="#0d9488" stroke-width="1.5" marker-end="url(#g)"/>
  <!-- 计划 -->
  <rect x="260" y="146" width="160" height="42" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="340" y="172" text-anchor="middle" font-size="13" fill="#0f766e" font-weight="bold">计划</text>
  <!-- 计划 -> 执行 -->
  <line x1="340" y1="188" x2="340" y2="208" stroke="#0d9488" stroke-width="1.5" marker-end="url(#g)"/>
  <!-- 执行 -->
  <rect x="260" y="208" width="160" height="44" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/>
  <text x="340" y="230" text-anchor="middle" font-size="13" fill="#0f766e">执行</text>
  <text x="340" y="246" text-anchor="middle" font-size="9" fill="#0d9488">正常步骤：effort = low / adaptive</text>
  <!-- 成功出口 -->
  <line x1="420" y1="230" x2="474" y2="230" stroke="#0d9488" stroke-width="1.5" marker-end="url(#g)"/>
  <text x="447" y="224" text-anchor="middle" font-size="9" fill="#0d9488">成功</text>
  <rect x="474" y="210" width="150" height="40" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="549" y="228" text-anchor="middle" font-size="11" fill="#0f766e">继续 / 完成</text>
  <text x="549" y="244" text-anchor="middle" font-size="9" fill="#0d9488">正常主路径</text>
  <!-- 失败/偏离 -> 深度思考 -->
  <path d="M408,248 C432,254 442,274 460,298" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#h)"/>
  <text x="433" y="270" text-anchor="middle" font-size="9" fill="#7c3aed">失败 / 偏离</text>
  <!-- 深度思考 Escalate -->
  <rect x="460" y="270" width="180" height="58" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="550" y="294" text-anchor="middle" font-size="12" fill="#5b21b6" font-weight="bold">深度思考 · Escalate</text>
  <text x="550" y="312" text-anchor="middle" font-size="10" fill="#5b21b6">low → high / max</text>
  <!-- 深度思考 -> 重规划（终点接入重规划框右缘中点，不悬空） -->
  <path d="M550,328 V346 H420 V310" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#h)"/>
  <text x="476" y="342" text-anchor="middle" font-size="9" fill="#7c3aed">根因 + 重规划</text>
  <!-- 重规划 -->
  <rect x="260" y="290" width="160" height="40" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/>
  <text x="340" y="315" text-anchor="middle" font-size="13" fill="#0f766e">重规划</text>
  <!-- 重规划 -> 回计划（绕左侧回环） -->
  <path d="M260,310 H200 V168 H260" fill="none" stroke="#0d9488" stroke-width="1.5" marker-end="url(#g)"/>
  <text x="195" y="244" text-anchor="end" font-size="9" fill="#0d9488">更新计划</text>
  <text x="195" y="258" text-anchor="end" font-size="9" fill="#0d9488">回主路径，effort 降回 low</text>
</svg>
