<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="680" height="340" fill="#ffffff"/>
  <text x="340" y="30" text-anchor="middle" font-size="18" fill="#0f766e" font-weight="bold">每个决策点同时做两维决策</text>
  <defs>
    <marker id="c" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#475569"/></marker>
  </defs>
  <circle cx="350" cy="200" r="38" fill="#ccfbf1" stroke="#0d9488" stroke-width="2.5"/>
  <text x="350" y="196" text-anchor="middle" font-size="15" fill="#0f766e" font-weight="bold">决策</text>
  <text x="350" y="214" text-anchor="middle" font-size="15" fill="#0f766e" font-weight="bold">点</text>
  <rect x="40" y="168" width="175" height="64" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="127" y="190" text-anchor="middle" font-size="14" fill="#0f766e" font-weight="bold">做什么（规划）</text>
  <text x="127" y="212" text-anchor="middle" font-size="11" fill="#0f766e">你写下的结构</text>
  <rect x="60" y="258" width="56" height="28" rx="5" fill="#ffffff" stroke="#0d9488"/>
  <text x="88" y="276" text-anchor="middle" font-size="11" fill="#0f766e">分解</text>
  <rect x="122" y="258" width="56" height="28" rx="5" fill="#ffffff" stroke="#0d9488"/>
  <text x="150" y="276" text-anchor="middle" font-size="11" fill="#0f766e">排序</text>
  <rect x="184" y="258" width="56" height="28" rx="5" fill="#ffffff" stroke="#0d9488"/>
  <text x="212" y="276" text-anchor="middle" font-size="11" fill="#0f766e">依赖</text>
  <line x1="312" y1="200" x2="215" y2="200" stroke="#475569" stroke-width="2" marker-end="url(#c)"/>
  <rect x="262" y="45" width="190" height="58" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="357" y="68" text-anchor="middle" font-size="14" fill="#5b21b6" font-weight="bold">想多深（推理）</text>
  <text x="357" y="90" text-anchor="middle" font-size="11" fill="#5b21b6">你配置的档位</text>
  <rect x="262" y="118" width="62" height="26" rx="5" fill="#ffffff" stroke="#7c3aed"/>
  <text x="293" y="135" text-anchor="middle" font-size="10" fill="#5b21b6">none</text>
  <rect x="330" y="118" width="56" height="26" rx="5" fill="#ffffff" stroke="#7c3aed"/>
  <text x="358" y="135" text-anchor="middle" font-size="10" fill="#5b21b6">low</text>
  <rect x="392" y="118" width="56" height="26" rx="5" fill="#ffffff" stroke="#7c3aed"/>
  <text x="420" y="135" text-anchor="middle" font-size="10" fill="#5b21b6">high</text>
  <rect x="454" y="118" width="56" height="26" rx="5" fill="#ffffff" stroke="#7c3aed"/>
  <text x="482" y="135" text-anchor="middle" font-size="10" fill="#5b21b6">max</text>
  <line x1="350" y1="162" x2="350" y2="103" stroke="#475569" stroke-width="2" marker-end="url(#c)"/>
  <text x="340" y="318" text-anchor="middle" font-size="12" fill="#64748b">两维在同一决策点咬合，是一家不是两家</text>
</svg>
